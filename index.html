/* 3페이즈 다인 대사 — 회피 성공·치명적 피해는 문서대로, 2·3번은 임시 조건(다인 카드 첫 적중·두 번째 적중) */
function dainP3(kind,loss){
  const C=S.C,E=C&&C.E;if(!E||!E.boss||E.phase!==3||S.run.mode!=='dain'||!C.curSpecial)return;
  E.dsaid=E.dsaid||{};
  if(kind==='miss'){say(BOSS_DAIN.p3miss);return}
  if(loss>=E.maxHp*.1&&!E.dsaid.crit){E.dsaid.crit=1;say(BOSS_DAIN.p3crit);return}
  E.dhits=(E.dhits||0)+1;
  if(E.dhits===1)say(BOSS_DAIN.p3a);else if(E.dhits===2)say(BOSS_DAIN.p3b);
}
/* V32 은빛 기사: 보스가 소환하는 적 캐릭터. 살아 있는 동안 보스 대신 피해를 받음 */
const destroyBuild=()=>{const r=S.run;return !!(r&&(r.mode==='dain'||r.mode==='surt'))};
/* 은빛 기사 2명 — 대상 지정 불가, 명령-보호: 살아 있는 무작위 1명이 보스의 피해를 50%는 전부, 50%는 75%만 대신 맞고, 대신 맞은 기사는 다음 턴에 움직이지 않음 */
const knAlive=E=>(E&&E.kns||[]).filter(k=>k.hp>0);

function knightTake(d){const C=S.C,E=C.E,ks=knAlive(E);if(!ks.length||d<=0)return d;const k=pick(ks),part=rnd()<.5?d:Math.ceil(d*.75),rest=d-part;
  k.hp=Math.max(0,k.hp-part);k.stun=C.turn+1;fxAt('enemy',`은빛 기사 -${part}`,'info');knightHitAnim(E.kns.indexOf(k));renderKnight();clog(`은빛 기사가 대신 받음 -${part} (남은 체력 ${k.hp})${rest?` · 경감 후 보스 -${rest}`:''}`,'e');
  if(k.hp<=0)clog('은빛 기사가 쓰러졌다','e');return rest}
/* V32 페이즈 전환: 체력이 1 이하로 떨어지면 턴 종료 후 특수 대사(컷신)를 보여 주고 다시 재개 */
async function bossPhaseCut(){
  const C=S.C,E=C.E,p=E.pendPhase;E.pendPhase=0;if(!p||C.over)return;

/* 인트로: 마을 길 4장을 차례로 다가가며 보여 주고, 마지막 장이 타이틀 반복 화면이 됨 */
const INTRO_SEQ=['road1','road2','road4','road3'],INTRO_SEG=3200,INTRO_FADE=1100;
/* V32 인트로 영상 — 세상은 멸망했다 … 푸른 세상이 보고 싶다 (웹게임 문서 '인트로 (우선)') */
function introFilm(cv, done, titleLoop) {

  const g = cv.getContext('2d');
  const W = 1600, H = 900;
  const REDUCED = false;

  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const sm = k => { k = clamp(k); return k * k * (3 - 2 * k); };
  const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // 시간표(초)와 대사
  const T = { s1: [0, 6.6], s2: [6.6, 15.6], s3: [15.6, 21.2], s4: [21.2, 31.2], end: 32.8 };
  const LINES = [
    { text: '세상은 멸망했다.', a: 1.2, b: 5.8 },
    { text: '하지만 유지되었고,', a: 7.4, b: 10.9 },
    { text: '사람들은 이 현상에 안주했다.', a: 11.5, b: 15.1 },
    { text: '하지만 나는,', a: 16.6, b: 20.8 },
    { text: '푸른 세상이 보고 싶다.', a: 24.6, b: 30.5 }
  ];

  // 테이퍼 가지
  function taper(p, x0, y0, qx, qy, x1, y1, w0, w1) {
    const N = 18, A = [], B = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, mt = 1 - t;
      const x = mt * mt * x0 + 2 * mt * t * qx + t * t * x1, y = mt * mt * y0 + 2 * mt * t * qy + t * t * y1;
      const dx = 2 * mt * (qx - x0) + 2 * t * (x1 - qx), dy = 2 * mt * (qy - y0) + 2 * t * (y1 - qy), len = Math.hypot(dx, dy) || 1, w = (w0 + (w1 - w0) * t) / 2;
      A.push([x - dy / len * w, y + dx / len * w]); B.push([x + dy / len * w, y - dx / len * w]);
    }
    p.moveTo(A[0][0], A[0][1]); A.forEach(q => p.lineTo(q[0], q[1])); B.reverse().forEach(q => p.lineTo(q[0], q[1])); p.closePath();
  }
  function clouds(c, r, n, h, a) {
    for (let i = 0; i < n; i++) {
      const cx = r() * W, cy = r() * h, rw = W * (.15 + r() * .3);
      const cg = c.createRadialGradient(cx, cy, 0, cx, cy, rw);
      cg.addColorStop(0, `rgba(12,10,9,${a})`); cg.addColorStop(1, 'rgba(12,10,9,0)');
      c.fillStyle = cg; c.fillRect(0, 0, W, h);
    }
  }
  function glow(c, x, y, rad, col, a) {
    c.save(); c.globalCompositeOperation = 'lighter';
    const rg = c.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = rg; c.fillRect(0, 0, W, H); c.restore();
  }
  function vignette(c, a = .7) {
    const vg = c.createRadialGradient(W / 2, H * .45, H * .3, W / 2, H * .5, W * .75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${a})`);
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
  }

  // 재와 불티
  const R = mulberry(5);
  const ASH = [...Array(110)].map(() => ({ x: R() * W, y: R() * H, v: .25 + R() * .7, d: (R() - .5) * .4, s: 1 + R() * 2.6, a: .2 + R() * .45, ph: R() * 6, em: R() < .07 }));
  const EMB = [...Array(46)].map(() => ({ u: R(), p: R(), v: .5 + R(), s: 1 + R() * 2.2, ph: R() * 6 }));
  function drawAsh(t, k = 1) {
    for (const p of ASH) {
      if (!REDUCED) { p.y += p.v; p.x += p.d + Math.sin(t / 1.4 + p.ph) * .35; if (p.y > H + 5) { p.y = -5; p.x = R() * W; } }
      g.fillStyle = p.em ? `rgba(228,138,70,${p.a * k})` : `rgba(205,198,186,${p.a * k})`;
      g.fillRect(p.x, p.y, p.s, p.s * .8);
    }
  }
  function embers(t, cx, cy, spread, rise, k = 1) {
    for (const e of EMB) {
      const life = ((t * e.v * .18) + e.p) % 1;
      const x = cx + (e.u - .5) * spread + Math.sin(t * 1.6 + e.ph) * 14, y = cy - life * rise;
      const a = Math.sin(life * Math.PI) * .75 * k;
      g.fillStyle = `rgba(255,${150 + ((e.ph * 40) | 0) % 70},70,${a})`; g.fillRect(x, y, e.s, e.s);
    }
  }

  /* ============ 1. 하이앵글: 위에서 내려다본 세계수 줄기, 불이 위에서 아래로 번짐 ============ */
  const S1 = (() => {
    const r = mulberry(31), c = mk(), x = c.getContext('2d');
    const bg = x.createRadialGradient(W / 2, H * 1.1, 0, W / 2, H * 1.1, W * .8);
    bg.addColorStop(0, '#3a2014'); bg.addColorStop(.45, '#1a1412'); bg.addColorStop(1, '#07080a');
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    clouds(x, r, 12, H, .4);
    // 아득한 아래쪽 안개와 미드가르드 불빛
    const fog = x.createLinearGradient(0, H * .55, 0, H);
    fog.addColorStop(0, 'rgba(110,100,90,0)'); fog.addColorStop(1, 'rgba(110,96,84,.28)');
    x.fillStyle = fog; x.fillRect(0, H * .55, W, H * .45);
    // 줄기: 가까운 위쪽은 넓고, 아래로 갈수록 소실점으로 좁아짐
    const trunk = new Path2D();
    trunk.moveTo(W * .2, -20);
    trunk.bezierCurveTo(W * .3, H * .35, W * .42, H * .7, W * .465, H + 20);
    trunk.lineTo(W * .545, H + 20);
    trunk.bezierCurveTo(W * .6, H * .7, W * .72, H * .35, W * .82, -20);
    trunk.closePath();
    // 아래로 뻗어 내려가는 가지들
    const br = new Path2D();
    [[.3, .12, -1, .9], [.74, .18, 1, .85], [.37, .38, -1, .6], [.64, .44, 1, .55], [.43, .62, -1, .38], [.58, .66, 1, .34]].forEach(([u, v, s, k]) => {
      const x0 = W * u, y0 = H * v;
      taper(br, x0, y0, x0 + s * W * .16 * k, y0 + H * .08 * k, x0 + s * W * .34 * k, y0 + H * .3 * k, 70 * k, 6);
    });
    x.fillStyle = '#120f0c'; x.fill(br);
    const bark = x.createLinearGradient(W * .2, 0, W * .82, 0);
    bark.addColorStop(0, '#090807'); bark.addColorStop(.35, '#1d1814'); bark.addColorStop(.6, '#2e2620'); bark.addColorStop(1, '#0c0a08');
    x.fillStyle = bark; x.fill(trunk);
    x.save(); x.clip(trunk); x.lineWidth = 2;
    const grooves = [];
    for (let i = 0; i < 64; i++) {
      const u = r(), x0 = lerp(W * .2, W * .82, u), x1 = lerp(W * .465, W * .545, u), mx = lerp(x0, x1, .45) + (r() - .5) * 40;
      x.strokeStyle = `rgba(0,0,0,${.25 + r() * .3})`;
      x.beginPath(); x.moveTo(x0, -20); x.quadraticCurveTo(mx, H * .5, x1, H + 20); x.stroke();
      grooves.push({ x0, mx, x1, d: r() * .4, w: 1.2 + r() * 1.8, burn: r() < .42 });
    }
    for (let i = 0; i < 26; i++) {
      const u = r(), x0 = lerp(W * .2, W * .82, u), x1 = lerp(W * .465, W * .545, u);
      x.strokeStyle = 'rgba(150,120,90,.08)'; x.beginPath(); x.moveTo(x0, -20); x.quadraticCurveTo(lerp(x0, x1, .5), H * .5, x1, H + 20); x.stroke();
    }
    x.restore();
    // 줄기가 아래 어둠 속으로 사라짐
    const fade = x.createLinearGradient(0, H * .62, 0, H);
    fade.addColorStop(0, 'rgba(14,11,9,0)'); fade.addColorStop(1, 'rgba(14,11,9,.85)');
    x.fillStyle = fade; x.fillRect(0, H * .62, W, H * .38);
    return { c, trunk, grooves };
  })();
  function smoke(cx, cy, rad, t, a) {
    // 열기에 말려 오르는 연기 (스케치의 소용돌이를 흐리게)
    g.save();
    g.filter = 'blur(14px)';
    g.translate(cx, cy); g.rotate(t * .12);
    g.strokeStyle = `rgba(140,58,30,${a * .16})`; g.lineWidth = 26; g.lineCap = 'round';
    g.beginPath();
    for (let i = 0; i <= 60; i++) {
      const an = i / 60 * Math.PI * 3.4, rr = rad * (1 - i / 60 * .75);
      const px = Math.cos(an) * rr, py = Math.sin(an) * rr * 1.3 - i * .8;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.stroke();
    g.restore();
  }
  function scene1(t, a) {
    const p = (t - T.s1[0]) / (T.s1[1] - T.s1[0]);
    g.save(); g.globalAlpha = a;
    const z = lerp(1, 1.07, ease(p));
    g.translate(W / 2, H * .4); g.scale(z, z); g.translate(-W / 2, -H * .4);
    g.drawImage(S1.c, 0, 0);
    // 균열을 따라 내려오는 불
    const fy = lerp(-H * .05, H * .78, ease(clamp(p * 1.1)));
    g.save(); g.clip(S1.trunk); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (const gv of S1.grooves) {
      if (!gv.burn) continue;
      const end = clamp((fy / H) - gv.d * .6, 0, 1);
      if (end <= 0) continue;
      const N = 28, n = Math.floor(N * end);
      const pt = i => { const u = i / N, mu = 1 - u; return [mu * mu * gv.x0 + 2 * mu * u * gv.mx + u * u * gv.x1, -20 + u * (H + 40)]; };
      for (const [lw, col] of [[gv.w * 4, 'rgba(176,60,20,.1)'], [gv.w * 1.4, 'rgba(230,110,40,.3)'], [gv.w * .5, 'rgba(255,214,140,.55)']]) {
        g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
        for (let i = 0; i <= n; i++) { const q = pt(i); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
        g.stroke();
      }
    }
    // 불이 지나간 위쪽은 붉게 그을림
    const sc = g.createLinearGradient(0, -20, 0, fy);
    sc.addColorStop(0, 'rgba(150,40,12,.32)'); sc.addColorStop(.85, 'rgba(110,28,10,.12)'); sc.addColorStop(1, 'rgba(238,128,48,.22)');
    g.fillStyle = sc; g.fillRect(0, -20, W, fy + 20);
    g.restore();
    glow(g, W / 2, fy, W * .35, '220,110,40', .22);
    glow(g, W / 2, -H * .1, W * .5, '230,110,40', .18 + .05 * Math.sin(t * 1.4));
    smoke(W * .13, H * .3, 90, t, 1); smoke(W * .88, H * .38, 100, -t * .9, 1);
    g.restore();
    g.save(); g.globalAlpha = a; embers(t, W / 2, fy + 40, W * .5, H * .7); drawAsh(t); vignette(g, .75); g.restore();
  }

  /* ============ 2. 미드가르드: 살아가는 사람들, 그리고 공양 ============ */
  const HZ = H * .66;
  const S2 = (() => {
    const r = mulberry(47), c = mk(), x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, HZ);
    sky.addColorStop(0, '#1f110b'); sky.addColorStop(.4, '#2b211c'); sky.addColorStop(.8, '#4f4840'); sky.addColorStop(1, '#6d675d');
    x.fillStyle = sky; x.fillRect(0, 0, W, HZ + 2);
    clouds(x, r, 14, HZ * .8, .38);
    // 먼 곳의 거대한 세계수
    const cx = W * .5, tw = W * .14;
    const tr = new Path2D();
    tr.moveTo(cx - tw * 1.6, HZ + 4); tr.bezierCurveTo(cx - tw * .9, HZ * .8, cx - tw * .6, HZ * .4, cx - tw * .45, -20);
    tr.lineTo(cx + tw * .45, -20); tr.bezierCurveTo(cx + tw * .6, HZ * .4, cx + tw * .9, HZ * .8, cx + tw * 1.6, HZ + 4); tr.closePath();
    const bk = x.createLinearGradient(cx - tw, 0, cx + tw, 0);
    bk.addColorStop(0, '#0c0a09'); bk.addColorStop(.6, '#241e19'); bk.addColorStop(1, '#0e0c0a');
    x.fillStyle = bk; x.fill(tr);
    x.save(); x.clip(tr);
    for (let i = 0; i < 30; i++) { const u = r(); x.strokeStyle = `rgba(0,0,0,${.2 + r() * .3})`; x.lineWidth = 2; x.beginPath(); x.moveTo(cx + (u - .5) * tw * 3.2, HZ); x.quadraticCurveTo(cx + (u - .5) * tw * 1.4, HZ * .4, cx + (u - .5) * tw * .9, -20); x.stroke(); }
    const burn = x.createLinearGradient(0, 0, 0, HZ * .32);
    burn.addColorStop(0, 'rgba(150,40,12,.8)'); burn.addColorStop(.85, 'rgba(238,128,48,.6)'); burn.addColorStop(1, 'rgba(238,128,48,0)');
    x.fillStyle = burn; x.fillRect(0, 0, W, HZ * .32);
    x.restore();
    // 아지랑이 낀 지평선과 무너진 마을
    const hz = x.createLinearGradient(0, HZ - H * .12, 0, HZ + H * .05);
    hz.addColorStop(0, 'rgba(140,130,118,0)'); hz.addColorStop(.6, 'rgba(140,130,118,.4)'); hz.addColorStop(1, 'rgba(60,56,50,0)');
    x.fillStyle = hz; x.fillRect(0, HZ - H * .12, W, H * .17);
    x.fillStyle = '#34373c';
    for (let px = 0; px < W;) { const bw = W * (.012 + r() * .03), bh = H * (.02 + r() * .07); if (r() > .25 && Math.abs(px - cx) > tw * 1.2) { x.fillRect(px, HZ - bh, bw, bh); if (r() > .6) { x.beginPath(); x.moveTo(px, HZ - bh); x.lineTo(px + bw / 2, HZ - bh - H * .04 * r()); x.lineTo(px + bw, HZ - bh); x.fill(); } } px += bw + W * .004; }
    const gr = x.createLinearGradient(0, HZ, 0, H);
    gr.addColorStop(0, '#4a453e'); gr.addColorStop(.35, '#2b2823'); gr.addColorStop(1, '#110f0c');
    x.fillStyle = gr; x.fillRect(0, HZ, W, H - HZ);
    for (let i = 0; i < 240; i++) { const k = r(), yy = HZ + (H - HZ) * k * k, xx = r() * W; x.fillStyle = `rgba(${r() > .5 ? 210 : 30},${r() > .5 ? 200 : 28},190,${.05 + r() * .08})`; x.fillRect(xx, yy, 2 + k * 8, 1 + k * 3); }
    return { c };
  })();
  const S2b = (() => {
    // 성전 앞 공양: 하얀 불꽃 제단
    const r = mulberry(53), c = mk(), x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, H * .7);
    sky.addColorStop(0, '#14100d'); sky.addColorStop(1, '#3a3631');
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    clouds(x, r, 10, H * .6, .35);
    // 성전 실루엣 (뒤로 세계수 불빛)
    const back = x.createRadialGradient(W / 2, -H * .1, 0, W / 2, -H * .1, W * .6);
    back.addColorStop(0, 'rgba(200,90,36,.35)'); back.addColorStop(1, 'rgba(200,90,36,0)');
    x.fillStyle = back; x.fillRect(0, 0, W, H);
    x.fillStyle = '#121216';
    const bx = W * .5;
    x.fillRect(bx - W * .24, H * .28, W * .48, H * .5);
    [[-.18, .5], [0, .72], [.18, .5]].forEach(([dx, hh]) => {
      const sx = bx + dx * W, sw = W * .06;
      x.fillRect(sx - sw / 2, H * (.78 - hh), sw, H * hh);
      x.beginPath(); x.moveTo(sx - sw / 2 - 8, H * (.78 - hh)); x.lineTo(sx, H * (.78 - hh - .14)); x.lineTo(sx + sw / 2 + 8, H * (.78 - hh)); x.fill();
    });
    // 창과 장식선
    x.fillStyle = 'rgba(255,250,240,.07)';
    for (let i = 0; i < 6; i++) { const wx = bx - W * .2 + i * W * .072 + (i > 2 ? W * .04 : 0); x.beginPath(); x.moveTo(wx, H * .5); x.lineTo(wx, H * .4); x.quadraticCurveTo(wx + 12, H * .37, wx + 24, H * .4); x.lineTo(wx + 24, H * .5); x.fill(); }
    x.strokeStyle = 'rgba(0,0,0,.5)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(bx - W * .24, H * .33); x.lineTo(bx + W * .24, H * .33); x.stroke();
    x.fillStyle = '#08080a';
    x.beginPath(); x.moveTo(bx - W * .06, H * .78); x.lineTo(bx - W * .06, H * .5); x.quadraticCurveTo(bx, H * .4, bx + W * .06, H * .5); x.lineTo(bx + W * .06, H * .78); x.fill();
    // 계단과 바닥
    const gr = x.createLinearGradient(0, H * .78, 0, H);
    gr.addColorStop(0, '#3e3a33'); gr.addColorStop(1, '#0f0d0b');
    x.fillStyle = gr; x.fillRect(0, H * .78, W, H * .22);
    x.fillStyle = 'rgba(0,0,0,.25)';
    for (let i = 0; i < 4; i++) x.fillRect(bx - W * (.2 - i * .02), H * (.78 + i * .025), W * (.4 - i * .04), 3);
    return { c };
  })();
  // 사람 실루엣
  function person(x, y, s, o) {
    g.save(); g.translate(x, y); g.scale(s, s);
    g.fillStyle = o.col || '#0b0b0c';
    const bow = o.bow || 0, step = o.step || 0;
    // 다리
    g.lineCap = 'round'; g.strokeStyle = g.fillStyle; g.lineWidth = 9;
    if (o.kneel) {
      g.beginPath(); g.moveTo(-6, -20); g.lineTo(-22, -4); g.lineTo(6, 0); g.stroke();
    } else {
      g.beginPath(); g.moveTo(-3, -42); g.lineTo(-6 + Math.sin(step) * 8, 0); g.moveTo(3, -42); g.lineTo(6 - Math.sin(step) * 8, 0); g.stroke();
    }
    // 몸통(기울기)
    const hipY = o.kneel ? -22 : -42;
    g.translate(0, hipY); g.rotate(bow);
    g.beginPath(); g.moveTo(-13, 0); g.quadraticCurveTo(-15, -30, -9, -46); g.lineTo(9, -46); g.quadraticCurveTo(15, -30, 13, 0); g.closePath(); g.fill();
    g.beginPath(); g.arc(0, -56, 9.5, 0, Math.PI * 2); g.fill();
    if (o.load) { g.fillRect(6, -46, 18, 14); }
    g.restore();
  }
  function kneeler(x, y, s, bw) {
    // 뒤에서 본 무릎 꿇은 사람: 고개를 숙이면 등이 둥글게 낮아짐
    g.save(); g.translate(x, y); g.scale(s, s);
    g.fillStyle = '#08080a';
    const h = lerp(58, 36, bw);
    g.beginPath(); g.ellipse(0, -8, 30, 10, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(-26, -6); g.bezierCurveTo(-28, -h * .7, -16, -h, 0, -h); g.bezierCurveTo(16, -h, 28, -h * .7, 26, -6); g.closePath(); g.fill();
    g.beginPath(); g.arc(0, -h - lerp(10, -2, bw), 10, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,250,240,.18)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-18, -h * .9); g.quadraticCurveTo(0, -h - 4, 18, -h * .9); g.stroke();
    g.restore();
  }
  const WALK = [...Array(9)].map((_, i) => { const r = mulberry(70 + i); return { x: r() * W, y: HZ + (H - HZ) * (.22 + r() * .6), v: (r() < .5 ? -1 : 1) * (8 + r() * 14), ph: r() * 6, load: r() < .35, sit: r() < .2 }; });

function chooseIntent(){

    if(has(E,'무모함'))ord=ord.filter(a=>ACT[a].k!=='def');
    if(E.asked)ord=ord.filter(a=>a!=='견해 묻기');
    if(E.turn===0&&has(E,'침착함')){const df=ord.find(a=>ACT[a].k==='def');if(df){E.intent=df;E.idx=ord.indexOf(df);return}}
    E.intent=ord[((E.idx%ord.length)+ord.length)%ord.length];return}
  let pool={...d.acts};
  if(E.key==='priest'&&S.run&&S.run.flags&&S.run.flags.noTithe)delete pool['공양 요구'];
  if(has(E,'무모함'))for(const k in pool)if(ACT[k].k==='def')delete pool[k];
  if(E.turn===0&&has(E,'침착함')){const df=Object.keys(d.acts).find(k=>ACT[k].k==='def');if(df){E.intent=df;return}}
  if(E.last.length===2&&E.last[0]===E.last[1]&&Object.keys(pool).length>1)delete pool[E.last[0]];
  E.intent=wpick(pool);
}

/* ================= 운 주사위 판정 (웹게임 문서: 이벤트 판정) =================
   이벤트용 판정은 운 주사위(정36면체)로 함. P: 명중률, S: 이벤트에 따라 공격레벨 또는 방어레벨
   목표값 T = 36 - P/5 + 난이도 보정 · 최소값 M = 1 + (S ÷ 10, 소수점 버림), 최대 18
   주사위는 M~36 사이에서 나오고, T 이상이면 성공 · T가 M 이하면 굴리지 않고 무조건 통과 (궁니르는 무조건 통과)
   난이도 보정: 쉬움 -6, 보통 0, 어려움 +6 */
const DIFF={easy:{n:'쉬움',v:-6},normal:{n:'보통',v:0},hard:{n:'어려움',v:6}};
const LSTAT={atk:'공격레벨',def:'방어레벨',acc:null};
function luck(chk){
  const r=S.run,P=pAcc(),Sv=chk.s==='atk'?pAtk():chk.s==='def'?pDef():0;
  const T=36-P/5+DIFF[chk.d].v,M=Math.min(18,1+Math.floor(Sv/10))+(eqW('as_a')?2:0),need=Math.ceil(T);
  const auto=T<=M,pct=auto?100:need>36?0:Math.round((36-Math.max(need,M)+1)/(36-M+1)*100);
  return{P,Sv,T,M,need,auto,pct};
}
const chkLabel=(chk,L)=>`판정 · 명중률 ${L.P}%${LSTAT[chk.s]?` + ${LSTAT[chk.s]} ${L.Sv}`:' 단독'} · ${DIFF[chk.d].n} · ${L.auto?'무조건 통과':`성공 ${L.pct}%`}`;

    case'card':if(myth()){deckFixed();return next()}for(let i=0;i<(b||1);i++)addToDeck(a);return next();
    case'curse':return next();
    case'hp':r.hp=Math.max(hpFloor(),Math.min(r.maxHp,r.hp+a));return next();
    case'hpPct':r.hp=Math.max(hpFloor(),Math.min(r.maxHp,r.hp+Math.round(r.maxHp*a/100)));return next();
    case'maxHp':r.maxHp=Math.max(1,r.maxHp+a);r.hp=clamp(r.hp,hpFloor(),r.maxHp);return next();
    case'removeId':{if(myth()){deckFixed();return next()}const c=r.deck.find(x=>x.id===a);if(c){r.deck.splice(r.deck.indexOf(c),1);notes.push(`「${CARDS[a].name}」 제거`)}else notes.push(`덱에 ${CARDS[a].name}이(가) 없다`);return next()}

    case'mimirCost':{if(r.mode==='human'){const k=1+a/100;r.base1=r.base1*k;r.maxHp=Math.max(1,Math.round(r.maxHp*k))}else r.maxHp=Math.max(1,r.maxHp+b);r.hp=clamp(r.hp,hpFloor(),r.maxHp);return next()}

      for(let i=0;i<a&&cs.length;i++){const c=cs.splice(Math.floor(rnd()*cs.length),1)[0];r.deck.splice(r.deck.indexOf(c),1);notes.push(`「${CARDS[c.id].name}」 제거`)}return next()}
    case'upgrade':return next();

    case'rare':{if(myth()){deckFixed();return next()}const opts=shuffle([...POOL.rare]).slice(0,3);const sc=openScreen('',{dim:true});

  ['V2.19.26.3','10/30','신화 무기 · 신화 빌드 밸런스 — 2장 적 장비 등급 확률을 문서대로(영웅 91 · 전설 8 · 신화 1%, 지금까지는 신화 5%로 나왔음). 신화 장비 수치 조정: 정의된 관 공·방 +60 → +45, 이름 없는 갑주 최대 체력 +500 → +300 · 방어레벨 +40 → +45, 기록관의 팔찌 명중 +50 → +30 · 회피 +30 → +20. 신화 빌드로 바뀔 때 공격레벨·방어레벨·최대 체력은 신의 기준 수치와 지금 주인공 수치 중 높은 쪽(다인 · 토르 · 레바테인 수르트모드 모두, 다인은 레벨 1 고정 · 섭취 상한 그대로). 레바테인 수르트모드는 레벨을 이어 감(체력 300 · 레벨 1로 시작하던 것)'],
  ['V2.19.25.3','10/30','주식 밸런스 — 위험이 클수록 기대 수익이 큼(레미 안정 · 크리밀라 고위험), 종목마다 급등·급락 빈도와 크기가 다름, 오름세는 지도 이동으로 흐른 시간에만 붙고 시간 넘기기는 오르내리기만 함, 시간 넘기기는 상점 한 번 들를 때마다 최대 24시간, 매도 수수료 2%(손익·평가는 수수료를 뺀 금액), 주가 하한은 기준가의 10%'],
  ['V2.19.24.3','10/30','드래그 중 예상 체력 — 공격 카드를 끌어 상대 위(또는 사용 위치)에 올리면 그 상대의 체력 막대에 공격 후 남을 체력 범위를 보여 줌(밝은 칸은 최소 피해, 줄무늬 칸은 최대 피해까지), 아래에 「현재 → 예상 체력 · 적중률 · 타수」, 쓰러뜨릴 수 있으면 처치/처치 가능 표시. 방어도·취약·약화 등 지금 상태를 반영, 뭉치는 장수만큼 합산. 적중하지 않으면 피해 없음'],
  ['V2.19.23.3','10/30','가시성 — 패의 카드에 종류별 후광: 공격 빨간색 · 방어 파란색 · 지원(기술·지속) 초록색 · 저주 보라색, 지금 사용할 수 없는 카드(코스트 부족·봉인·적 턴 등)는 후광 없음. 끌어서 낼 수 있는 위치에 오면 후광이 더 밝아짐'],
  ['V2.19.22.3','10/30','아쉬부티 공방 보존파(모작파에서 이름 변경) — 보존파 고증가의 견해 묻기에 세 번째 선택지 추가: 방어도가 50 이상일 때만 보이는 「얻기만 하고 사용하지 않겠다」(…! — 말문이 막혀 다음 행동 취소)'],
  ['V2.19.21.3','10/30','아쉬부티 공방 곡해파 — 니다벨리르 일반 적 「아쉬부티 공방 곡해파 전시가」 추가, 곡해(쓸 때마다 약화 · 방어도 · 드로우 감소 · 예술적 감각 중 무작위 반응). 첫 만남 — 전투에 들어가기 전 그림과 선택지 창만 뜸: 신화 원전은 잔혹한가 · 신성한가 · 정론은 무엇인가, 답마다 50%로 전투 또는 그냥 지나감, 「신화엔 정론이란 없다」는 50%로 곡해파 입단 제의. 아쉬부티 공방 보존파 — 니다벨리르 일반 적 「아쉬부티 공방 보존파 고증가」 추가, 고증(같은 행동을 연달아 이을 때마다 예술적 감각 +1, 3이면 작품 제작). 전투 중 견해 묻기 — 강한 유물을 대가를 치르더라도 쓰겠느냐: 사용한다(단죄 — 최대 체력 30% 트루 데미지) / 사용하지 않겠다(전투 지속). 아쉬부티 공방 방직파 — 니다벨리르 일반 적 「아쉬부티 공방 방직파 직조공」 추가(아쉬부티 상점 전투의 직원). 짜임새(앞과 다른 행동을 이을 때마다 예술적 감각 +1, 3이면 작품 제작 → 2턴 뒤 작품 완성, 공격 위력 +200%). 견해 묻기 — 전투에 한 번, 작품의 실을 어디에 연결할지 물음: 뿔처럼 보이는 곳(전투 지속) / 평평한 곳(예술적 감각 3 이상 또는 작품이 있으면 처치 없이 전투 종료 · 실링만, 아니면 전투 지속) / 남의 시선에 의존하느냐는 질문(상대가 예술적 감각을 전부 소모해 분노, 1당 공격 위력 +30%)'],
  ['V2.18.21.3','10/30','기믹 — 정예 · 보스의 일부 공격에 조건이 붙음. 대비(방어도로 막으면 피해 -80% · 못 막으면 +100%), 간파(회피를 올려 두면 반드시 빗나감 · 아니면 반드시 적중, 피해 +50%), 기세 꺾기(이번 턴 그 적에게 최대 체력 15% 이상 피해를 주면 피해 -70% · 아니면 +50%). 의도에 기믹 이름과 지금 성공/실패가 보이고 예상 피해가 바로 바뀜. 붙은 공격 — 이단심문관 처단(대비), 순수유물주의자 공양의 칼(기세 꺾기), 송출관 승강기 레버(대비), 특허 심사관 반려 서류(간파), 스타인러 장인 과열 망치(기세 꺾기), 크리뷔스 협업 책임자 얼음 깨기(간파), 레미 총주방장 무쇠 팬(대비), 아쉬부티 해설사 전시 지팡이(기세 꺾기), 경비원 진압봉(대비), 기록하는 공무원 삭제(대비)'],
  ['V2.18.20.3','10/30','세계수 등반 전투 밸런스 — 1장 적 체력 · 공격 피해 배율(일반 체력 ×4 · 피해 ×3.5, 정예 ×2 · ×1.6, 보스 ×1.3 · ×1.2, 처음 8막 동안은 서서히 올라감), 2장 정예 · 보스는 낮춤(정예 체력 ×0.4 · 피해 ×0.3, 보스 ×0.3 · ×0.4 — 회복 없는 중앙정부 연전에 맞춤), 난이도별 적 배율 조정(매우 쉬움 0.75 · 쉬움 1 · 보통 1.1 · 어려움 1.15 · 매우 어려움 1.3), 특허 — 실링이 모자라면 카드를 못 쓰던 것을 최대 체력 4%로 대신 냄'],
  ['V2.18.19.3','10/30','2장 장비 탈취 — 공격레벨 · 방어레벨로 대신하던 것을 없애고 적이 착용한 장비를 실제로 빼앗음. 2장 적은 영웅(공방 장비, 그 적의 공방 우선) · 전설 · 신화 무구를 착용, 전설 · 신화는 니다벨리르 무구 8종(임시)'],
  ['V2.18.18.3','10/30','주사위 연출 — 공격 주사위가 굴러간 뒤 주사위 값 · 위력 · 적중률 · 피해를 가운데에 크게 보여 주고 나서 공격이 들어감(나와 적 모두, 같은 카드의 다음 주사위는 빠르게, 누르면 빨리 넘김, 설정에서 끌 수 있음). 여러 적 전투 — 오른쪽 목록 대신 절멸전처럼 적이 화면에 따로따로 서고, 누르거나 카드를 끌어 놓은 적이 대상이 됨(적마다 의도 · 체력 · 행동 수치)'],
  ['V2.18.17.3','10/30','주식은 2장 니다벨리르에서만(공방 상점 · 암시장, 1장에서는 시간이 흐르지 않음). 1장 미드가르드에서는 일반~희귀 장비만 나오고 영웅 등급 이상은 착용할 수 없음(얻으면 보관함으로) — 1장 적 소지 장비는 일반~희귀, 1장 암시장 물건은 희귀 등급 9종. 2장 니다벨리르(밑 공방)부터 적은 전부 영웅 등급 이상 무구를 착용(탈취 시 장비 대신 공격레벨 · 방어레벨)'],
  ['V2.18.16.3','10/30','암시장 — 상점에 들어가면 10% 확률로 본래 상점 대신 열림(1장·2장, 튜토리얼 상점 제외). 장점과 단점이 모두 큰 전설 장비 9종 중 4개 진열, 묠니르의 파편 · 궁니르의 조각 판매(같은 것을 9개 모으면 획득 사건, 묠니르는 기존 획득 사건 · 궁니르는 사건 글 작성 예정), 거래 칸에 주식과 도박장. 도박장은 암시장에서만 열리고 본래 상점에서는 빠짐. 2장 가격은 1장의 100배(임시). 암시장 튜토리얼'],
  ['V2.17.16.3','10/30','도박장 카드를 전투처럼 끌어서 냄 — 포카드는 바꿀 카드를 끌어 교체 칸에 놓고 바꾸기(교체 칸의 카드를 누르면 패로 돌아옴), 블랙잭은 히트 · 스탠드 · 더블 행동 카드를 끌어 내 카드 위에 놓음, 원카드와 같은 방식 · Enter로도 낼 수 있음'],
  ['V2.17.15.3','10/30','주식 시간 넘기기 — 주식 화면 안에서 +1시간 · +6시간 · +24시간, 이동하지 않고 시간을 보내 주가를 움직임'],
  ['V2.17.14.3','10/30','상점·주식·도박장 화면 손봄 — 상점이 스크롤 없이 한 화면에 다 보임(카드·장비·버튼 크기 줄임), 오른쪽 버튼은 이름과 꼭 필요한 값만, 장비는 효과만 짧게 보이고 누르면 가격까지 전부 보임, 카드 설명은 두 줄까지 보이고 누르면 뒷면에 전부. 주식·도박장 화면도 작게 줄이고 설명을 덜어냄. 원카드는 전투처럼 패의 카드를 끌어 가운데 카드 위에 놓아서 냄'],
  ['V2.17.13.3','10/30','상점 화면 개편 — 오른쪽(세로 화면은 아래) 빈 자리에 큰 버튼으로 카드 강화 · 카드 제거 · 새로고침 · 장비 판매 · 주식 · 도박장 · 떠난다 · 전투를 모음, 구매 버튼도 크게. 도박장 — 판돈 1단화 · 10단화 · 100단화, 게임 원카드(2인 · 7장, 2·A 공격, J·Q·K 한 번 더, 7 문양 바꾸기, 승리 2배) · 포카드(5장 한 번 교체, 족보 배당 J 이상 원페어 1배 ~ 로열 스트레이트 플러시 250배) · 블랙잭(히트 · 스탠드 · 더블, 승리 2배 · 블랙잭 2.5배 · 무승부 1배). 튜토리얼 — 주식 · 도박장 · 원카드 · 포카드 · 블랙잭을 처음 열 때 설명, 다시 보기 버튼, 설정에서 튜토리얼 다시 보기를 켜면 함께 다시 나옴'],
  ['V2.16.13.3','10/30','용어 변경 — 장은 이야기 기준(1장 미드가르드 · 2장 니다벨리르, 이전의 막), 막은 전투·정예·상점·사건 한 곳 기준(이전의 칸), 턴은 전투 턴 기준. 주식·도박 — 모의 주식: 니다벨리르 5대 공방 5종목(레미·스타인러·아쉬부티·크리뷔스·크리밀라, 종목마다 변동성이 다름, 가끔 급등·급락), 지도에서 한 막 이동할 때마다 1시간이 지나고 주가가 움직임, 1장·2장 모든 상점의 주식 버튼에서 매수·매도(1 · 10 · 100 · 최대 / 전부 매도), 보유 주수·평균가·평가 손익·최근 48시간 그래프. 도박(2장 공방 상점): 10 · 30 · 50단화 중 판돈을 걸고 운 판정(명중률 단독 · 보통), 성공하면 판돈의 2배를 돌려받고 실패하면 잃음'],
  ['V2.15.13.3','10/30','게임 중 메뉴 — 상단 메뉴 버튼(또는 Esc)으로 계속하기 · 설정 · 저장하고 나가기 · 중단하기(두 번 눌러 확인, 저장 기록 지움), 세계수 등반·절멸전 모두, 세로 화면 상단 막대 정리'],
  ['V2.15.12.3','10/30','저장 기록 최대 10개(세계수 등반·절멸전 공용, 이어하기·목록·지우기, 10개가 차면 덮어쓸 기록 고름), 상점에서 보관함 장비 판매(본래 가격 60%), 등급 색(일반 흰색 · 희귀 초록색 · 영웅 보라색 · 전설 노란색 · 신화 빛나는 하얀색), 2장 철제 돔 d99 판정을 둘 다 무조건 실패로'],

const gStep=g=>{try{const v=localStorage.getItem(g.key);return v==null?0:v==='done'?-1:+v||0}catch(e){return -1}};
const gSet=(g,v)=>{try{localStorage.setItem(g.key,String(v))}catch(e){}};
function guideShow(){
  const box=$('#tut');if(!box)return;if(tutOn())return;
  for(const id in GUIDES){const g=GUIDES[id];let i=gStep(g);if(i<0||i>=g.steps.length)continue;
    if(g.steps[i].where!==S.screen){const j=g.steps.findIndex((st,k)=>k>i&&st.where===S.screen);if(j<0)continue;i=j;gSet(g,i)}
    const st=g.steps[i];box.hidden=false;box.className='tut '+st.where;stage.dataset.tut=st.hl||'';
    box.innerHTML=`<div class="tut-h"><span>튜토리얼 · ${g.n} · ${i+1} / ${g.steps.length}</span><button class="tut-skip" id="tutSkip">건너뛰기</button></div>
      <div class="tut-t">${st.t}</div>${st.x.map(l=>`<p>${l}</p>`).join('')}<button class="btn-main tut-next" id="tutNext">${st.last?'튜토리얼 끝':'다음'}</button>`;

}

/* 카드 앞면 주사위 — 전투 중이면 예상 피해 범위와 적중률을 함께 표시 */
function diceRowHTML(id,inst){
  const d=CARDS[id];if(!d.d||!d.d.length)return'';
  const C=S.C,live=inst&&C&&!C.over&&C.hand&&C.hand.includes(inst)&&(S.screen==='combat'||S.screen==='hunt');
  const g=[];for(const x of d.d){const l=g[g.length-1];if(l&&l.t===x.t&&l.a===x.a&&l.b===x.b)l.n++;else g.push({...x,n:1})}
  return g.map(x=>{let p='';
    if(live&&S.screen==='combat'){
      if(x.t==='atk'){const v=pPreview(inst,x);p=`<span><em>${v.lo}~${v.hi}</em> · 적중 ${v.ch}%</span>`}
      else if(x.t==='def'){const f=v=>Math.round(v*(pt('defUp')?1.25:1)*(pt('defDown')?.75:1));p=`<span><em>+${f(x.a)}~${f(x.b)}</em></span>`}
      else{const room=Math.max(0,EVA_DICE_CAP-C.evaB);p=`<span>적중 ${hitChance(enemyAcc(),pEva())}→<em>${hitChance(enemyAcc(),pEva()+Math.min(x.b,room))}%</em></span>`}}
    else if(live&&S.screen==='hunt'&&x.t==='atk'){const v=hDiePreview(inst,x);if(v)p=`<span><em>${v.lo}~${v.hi}</em> · 적중 ${v.ch}%</span>`}
    if(!p)return'';
    return`<div class="dz ${x.t}"><b>${x.t==='atk'?'예상 피해':x.t==='def'?'방어도':'적 적중'}${x.n>1?` ×${x.n}`:''}</b>${p}</div>`}).join('');

/* 효과음 — 브라우저에서 직접 합성 (파일 없음) */
let AC=null;
function sfx(kind,amt=1){
  if(!SET.sound)return;let a;try{a=AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume()}catch(e){return}
  const t=a.currentTime,out=a.destination,v=Math.min(1.5,amt);
  if(!sfx.nb){const b=a.createBuffer(1,a.sampleRate*.4|0,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;sfx.nb=b}
  const noise=(dur,f,q,vol,type='bandpass')=>{const s=a.createBufferSource();s.buffer=sfx.nb;
    const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(out);s.start(t);s.stop(t+dur+.02)};
  const tone=(f0,f1,dur,vol,type='sine',dl=0)=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t+dl);o.frequency.exponentialRampToValueAtTime(f1,t+dl+dur);
    const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.setValueAtTime(vol,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dl+dur+.02)};
  if(kind==='hit'){noise(.09,2600,.9,.35*v);noise(.16,500,.7,.35*v,'lowpass');tone(170,48,.16,.55*v)}
  else if(kind==='big'){noise(.12,2200,.7,.5*v);noise(.35,380,.6,.55*v,'lowpass');tone(120,32,.38,.8*v,'triangle');tone(60,28,.45,.5*v,'sine',.02)}
  else if(kind==='block'){tone(2300,1500,.14,.08,'square');tone(1250,900,.2,.08,'triangle');noise(.07,5200,3,.22)}
  else if(kind==='miss'){noise(.2,1200,1.4,.18,'bandpass')}
  else if(kind==='hurt'){tone(95,38,.28,.7*v,'triangle');noise(.18,700,.7,.4*v,'lowpass')}
  else if(kind==='gore'){/* 파육음: 젖은 살이 찢기는 소리 — 짧은 잡음 덩어리를 겹치고 낮게 꺼지는 울림 */
    const at=(dl,dur,f,q,vol,type)=>{const s2=a.createBufferSource();s2.buffer=sfx.nb;s2.playbackRate.value=.55+rnd()*.5;const fl=a.createBiquadFilter();fl.type=type||'bandpass';
      fl.frequency.setValueAtTime(f,t+dl);fl.frequency.exponentialRampToValueAtTime(Math.max(60,f*.35),t+dl+dur);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(.0001,t+dl);g.gain.linearRampToValueAtTime(vol,t+dl+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dl+dur);s2.connect(fl).connect(g).connect(out);s2.start(t+dl);s2.stop(t+dl+dur+.05)};
    [0,.09,.15,.27,.36,.52,.6].forEach((dl,i)=>at(dl,.16+rnd()*.14,900+rnd()*1400,2+rnd()*3,.55-.04*i));
    at(.05,.7,420,.8,.6,'lowpass');at(.4,.9,260,.7,.5,'lowpass');
    tone(70,26,.9,.9,'sine',.02);tone(140,40,.35,.35,'triangle',.3)}
}

/* ================= 도망치기 (플레이어) — 1턴 소모 후 판정, 성공하면 보상 없이 도망 (노드는 미개척), 실패하면 그 턴만 상대 카드 값 2배 · 정예·보스는 불가 =================
   성공률 = 100 − ((상대 명중 − 20) − ((내 회피 + 20) − 50)) — 두 값을 합치는 식은 문서에 없어 적중률 공식을 뒤집어 씀 (임시), 5~95% */

function genMap2(dir){

  while(Object.values(cnt).some(c=>c<M2PER)){if(++tries%4000===0)md*=.93;
    const x=(rnd()*2-1)*M2D,y=(rnd()*2-1)*M2D;if(Math.abs(x)+Math.abs(y)>M2D-22||Math.hypot(x,y)<120)continue;

    nodes.push({id:nodes.length,kind:'room',reg:g,x,y});cnt[g]++}

  cand.sort((a,b)=>a[0]-b[0]);const cap=n=>nodes[n].kind==='room'?4:6;
  for(const[,i,j]of cand){if(adj[i].size>=cap(i)||adj[j].size>=cap(j))continue;if(E.some(([a,b])=>segCross(nodes[i],nodes[j],nodes[a],nodes[b])))continue;adj[i].add(j);adj[j].add(i);E.push([i,j])}
  const reach=()=>{const seen=new Set([0]),q=[0];while(q.length){for(const n of adj[q.pop()])if(!seen.has(n)){seen.add(n);q.push(n)}}return seen};

    if(!best)break;adj[best[1]].add(best[2]);adj[best[2]].add(best[1]);E.push([best[1],best[2]])}
  for(let i=E.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[E[i],E[j]]=[E[j],E[i]]}
  for(const[a,b]of E){if(a===0||b===0||rnd()>.32||adj[a].size<3||adj[b].size<3)continue;adj[a].delete(b);adj[b].delete(a);if(reach().size!==nodes.length){adj[a].add(b);adj[b].add(a)}}

  nodes.forEach((n,i)=>{n.adj=[...adj[i]];n.x=Math.round(n.x);n.y=Math.round(n.y)});
  /* 2장 시작 (11/6): 낙하한 방향 지역의 중앙 근처 막에서 시작 → 그 방향 공방 → 중앙정부 */

}

const STOCKS={remi:{base:120,vol:.015,drift:.002,jp:.01,js:.10},stein:{base:180,vol:.025,drift:.003,jp:.015,js:.15},ash:{base:240,vol:.035,drift:.0035,jp:.02,js:.18},kriv:{base:150,vol:.05,drift:.0045,jp:.03,js:.20},krim:{base:90,vol:.075,drift:.006,jp:.04,js:.25}};

function ensureStock(r){if(!r.stock){const p={},hist={};for(const k in STOCKS){p[k]=Math.round(STOCKS[k].base*(.85+rnd()*.3));hist[k]=[p[k]]}r.stock={h:0,p,hist,own:{},log:[]}}return r.stock}
function stockTick(skip){const r=S.run;if(!r||r.act!==2)return;const st=ensureStock(r);st.h++;if(!skip)st.nat=(st.nat||0)+1;

function stockSpark(h){const w=120,ht=34,lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;
  const pts=h.map((v,i)=>`${(i/(Math.max(1,h.length-1))*w).toFixed(1)},${(ht-2-(v-lo)/sp*(ht-4)).toFixed(1)}`).join(' ');
  const up=h[h.length-1]>=h[0];return`<svg viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'#9ad6c4':'#ee9a8e'}" stroke-width="2"/></svg>`}
function eqToggle(root){root.querySelectorAll('.shoppanel .eqcard').forEach(c=>{c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-expanded','false');const t=e=>{if(e.target.closest('button'))return;const o=c.classList.toggle('open');c.setAttribute('aria-expanded',o)};c.addEventListener('click',t);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t(e)}})})}
function stockLine(r){const st=ensureStock(r);let w=0,c=0;for(const k in st.own){w+=stockNet(st.p[k],st.own[k].n);c+=st.own[k].cost}return w?`평가 ${money(w)} · <em class="${w>=c?'up':'dn'}">${w>=c?'+':'-'}${money(Math.abs(Math.round(w-c)))}</em>`:`${st.h}시간째`}

/* ---------- 블랙잭 ---------- */
function bjVal(h){let v=0,a=0;for(const c of h){if(c.r==='A'){a++;v+=11}else if('JQK'.includes(c.r))v+=10;else v+=+c.r}while(v>21&&a){v-=10;a--}return v}
function bjStart(){const G=CG;G.deck=deck52();G.p=[G.deck.pop(),G.deck.pop()];G.d=[G.deck.pop(),G.deck.pop()];
  const pb=bjVal(G.p)===21,db=bjVal(G.d)===21;if(pb||db)return bjEnd();bjDraw()}
function bjEnd(){const G=CG,p=bjVal(G.p),d=bjVal(G.d),pb=p===21&&G.p.length===2&&!G.dbl,db=d===21&&G.d.length===2;let ret=0,l;
  if(p>21){l='버스트 — 21을 넘었다'}
  else if(pb&&!db){ret=Math.round(G.paid*2.5);l='블랙잭'}
  else if(db&&!pb){l='딜러 블랙잭'}
  else if(d>21){ret=G.paid*2;l='딜러 버스트 — 승리'}
  else if(p>d){ret=G.paid*2;l='승리'}
  else if(p===d){ret=G.paid;l='무승부'}
  else l='패배';
  cgFinish(ret,l);bjDraw()}
function bjDealer(){const G=CG;while(bjVal(G.d)<17)G.d.push(G.deck.pop());bjEnd()}
function bjDraw(){const G=CG,r=S.run,hide=!G.done,live=!G.done;
  const canDbl=G.p.length===2&&!G.dbl&&r.gold>=G.stake;
  const acts=[['hit','히트','한 장 더',true],['stand','스탠드','멈춘다',true],['dbl','더블','판돈 ×2 · 한 장',canDbl]];
  const body=`<div class="table"><div class="seat"><div class="ap-h">딜러 · ${hide?bjVal([G.d[0]])+' + ?':bjVal(G.d)}</div><div class="pcs">${G.d.map((c,i)=>pcard(c,{back:hide&&i===1})).join('')}</div></div>
    <div class="seat"><div class="ap-h">나 · ${bjVal(G.p)}</div><div class="cgslot${live?' live':''}" id="bjSlot"><div class="pcs">${G.p.map(c=>pcard(c)).join('')}</div><em>${live?'행동 카드를 여기에 끌어 놓기':''}</em></div></div>
    ${live?`<div class="seat"><div class="ap-h">행동</div><div class="pcs hand">${acts.map(([k,n,t,ok])=>`<div class="pcwrap${ok?' ok':' no'}" data-a="${k}" ${ok?`tabindex="0" role="button" aria-label="${n}"`:'aria-disabled="true"'}><span class="pc actc"><b>${n}</b><i>${t}</i></span></div>`).join('')}</div></div>`:''}</div>`;
  const m=cgFrame('블랙잭',body,'');
  if(G.done)return;
  const act={hit:()=>{G.p.push(G.deck.pop());if(bjVal(G.p)>21)return bjEnd();if(bjVal(G.p)===21)return bjDealer();bjDraw()},stand:bjDealer,
    dbl:()=>{if(!canDbl)return;r.gold-=G.stake;G.paid+=G.stake;G.dbl=true;save();renderTop();G.p.push(G.deck.pop());if(bjVal(G.p)>21)return bjEnd();bjDealer()}};
  m.querySelectorAll('.hand .pcwrap.ok').forEach(el=>cgDrag(el,'bjSlot',act[el.dataset.a]));
}

/* ---------- 포카드 (5장 · 한 번 교체 · 족보 배당) ---------- */
const PK_PAY=[['로열 스트레이트 플러시',250],['스트레이트 플러시',50],['포카드',25],['풀하우스',9],['플러시',6],['스트레이트',4],['트리플',3],['투페어',2],['J 이상 원페어',1]];
function pkEval(h){const v=h.map(c=>c.r==='A'?14:c.r==='K'?13:c.r==='Q'?12:c.r==='J'?11:+c.r).sort((a,b)=>a-b),cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const n=Object.values(cnt).sort((a,b)=>b-a),fl=h.every(c=>c.s===h[0].s),uniq=n.length===5;
  const st=uniq&&(v[4]-v[0]===4||v.join()==='2,3,4,5,14');
  if(st&&fl&&v[0]===10)return 0;if(st&&fl)return 1;if(n[0]===4)return 2;if(n[0]===3&&n[1]===2)return 3;if(fl)return 4;if(st)return 5;if(n[0]===3)return 6;if(n[0]===2&&n[1]===2)return 7;
  if(n[0]===2){const p=+Object.keys(cnt).find(k=>cnt[k]===2);if(p>=11)return 8}return -1}
function pkStart(){const G=CG;G.deck=deck52();G.h=[0,1,2,3,4].map(()=>G.deck.pop());G.sw=[false,false,false,false,false];pkDraw()}
function pkDraw(){const G=CG,cur=pkEval(G.h);
  const n=G.sw.filter(Boolean).length;
  const body=`<div class="table">${G.done?'':`<div class="seat"><div class="ap-h">교체 칸 · ${n}장 · 누르면 패로 돌아온다</div><div class="cgslot live wide" id="pkSlot"><div class="pcs">${G.h.map((c,i)=>G.sw[i]?`<button class="pcwrap back-to" data-r="${i}" aria-label="${c.s}${c.r} 패로 되돌리기">${pcard(c)}</button>`:'').join('')}</div><em>${n?'':'바꿀 카드를 여기에 끌어 놓기'}</em></div></div>`}
    <div class="seat"><div class="ap-h">${G.done?'결과':`패 · 지금 족보 ${cur>=0?PK_PAY[cur][0]:'없음'}`}</div>
    <div class="pcs big hand">${G.h.map((c,i)=>G.done||!G.sw[i]?`<div class="pcwrap${G.done?'':' ok'}" data-i="${i}" ${G.done?'':`tabindex="0" role="button" aria-label="${c.s}${c.r} 교체 칸으로"`}>${pcard(c)}</div>`:'').join('')}</div></div>
    <div class="paytab">${PK_PAY.map(([nm,x],i)=>`<div class="${i===cur?'hit':''}"><span>${nm}</span><b>${x}배</b></div>`).join('')}</div></div>`;
  const m=cgFrame('포카드',body,`<button class="svc main" id="pkSwap"><b>${n?`${n}장 바꾸기`:'그대로 간다'}</b></button>`);
  if(G.done)return;
  m.querySelectorAll('.hand .pcwrap.ok').forEach(el=>cgDrag(el,'pkSlot',()=>{G.sw[+el.dataset.i]=true;pkDraw()}));
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{G.sw[+b.dataset.r]=false;pkDraw()});
  $('#pkSwap').onclick=()=>{G.h=G.h.map((c,i)=>G.sw[i]?G.deck.pop():c);const k=pkEval(G.h);cgFinish(k>=0?G.paid*PK_PAY[k][1]:0,k>=0?PK_PAY[k][0]:'족보 없음');pkDraw()};
}

/* ---------- 원카드 (2인 · 7장) ---------- */
function ocTake(n,who){const G=CG;for(let i=0;i<n;i++){if(!G.deck.length){const top=G.pile.pop();G.deck=shuffle(G.pile);G.pile=[top]}if(!G.deck.length)break;G[who].push(G.deck.pop())}}
function ocOk(c){const G=CG,t=G.pile[G.pile.length-1];if(G.atk>0)return c.r==='2'||c.r==='A';return c.s===G.suit||c.r===t.r}
function ocStart(){const G=CG;G.deck=deck52();G.me=[];G.ai=[];ocTake(7,'me');ocTake(7,'ai');G.pile=[G.deck.pop()];G.suit=G.pile[0].s;G.atk=0;G.turn='me';G.msg='내 차례';G.pick=false;ocDraw()}
function ocCheck(){const G=CG;if(!G.me.length){cgFinish(G.paid*2,'승리 — 손을 다 비웠다');return true}if(!G.ai.length){cgFinish(0,'패배 — 상대가 손을 다 비웠다');return true}
  if(G.me.length>=16){cgFinish(0,'패배 — 손에 16장이 쌓였다');return true}if(G.ai.length>=16){cgFinish(G.paid*2,'승리 — 상대 손에 16장이 쌓였다');return true}return false}
/* 낸 카드의 효과 — 한 번 더 내면 true */
function ocEffect(c){const G=CG;G.suit=c.s;if(c.r==='2')G.atk+=2;else if(c.r==='A')G.atk+=3;return'JQK'.includes(c.r)}
function ocPlay(i){const G=CG;if(G.done||G.turn!=='me'||G.pick)return;const c=G.me[i];if(!ocOk(c))return;G.me.splice(i,1);G.pile.push(c);const again=ocEffect(c);
  G.msg=`「${c.s}${c.r}」을(를) 냈다${again?' — 한 번 더':''}`;if(ocCheck())return ocDraw();
  if(c.r==='7'){G.pick=true;G.again=again;return ocDraw()}
  if(again)return ocDraw();G.turn='ai';ocDraw();setTimeout(ocAi,REDUCED?60:550)}
function ocPickSuit(s){const G=CG;G.suit=s;G.pick=false;G.msg=`문양을 ${s}(으)로 바꿨다`;if(G.again)return ocDraw();G.turn='ai';ocDraw();setTimeout(ocAi,REDUCED?60:550)}
function ocPass(){const G=CG;if(G.done||G.turn!=='me'||G.pick)return;const n=G.atk>0?G.atk:1;ocTake(n,'me');G.msg=G.atk>0?`공격을 받아 ${n}장 받았다`:'한 장 받았다';G.atk=0;
  if(ocCheck())return ocDraw();G.turn='ai';ocDraw();setTimeout(ocAi,REDUCED?60:550)}
function ocAi(){const G=CG;if(!G||G.done||G.game!=='onecard'||G.turn!=='ai'||$('#modal').hidden)return;
  const ok=G.ai.map((c,i)=>({c,i})).filter(x=>ocOk(x.c));
  if(!ok.length){const n=G.atk>0?G.atk:1;ocTake(n,'ai');G.msg=G.atk>0?`상대가 공격을 받아 ${n}장 받았다`:'상대가 한 장 받았다';G.atk=0;if(ocCheck())return ocDraw();G.turn='me';return ocDraw()}
  ok.sort((a,b)=>('2A'.includes(b.c.r)?2:'JQK'.includes(b.c.r)?1:0)-('2A'.includes(a.c.r)?2:'JQK'.includes(a.c.r)?1:0));
  const{c,i}=ok[0];G.ai.splice(i,1);G.pile.push(c);const again=ocEffect(c);
  if(c.r==='7'){const cnt={};G.ai.forEach(x=>cnt[x.s]=(cnt[x.s]||0)+1);G.suit=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||c.s}
  G.msg=`상대가 「${c.s}${c.r}」을(를) 냈다${c.r==='7'?` — 문양 ${G.suit}`:''}${G.atk>0?` — 공격 ${G.atk}장`:''}`;
  if(ocCheck())return ocDraw();if(again){ocDraw();return setTimeout(ocAi,REDUCED?60:550)}G.turn='me';ocDraw()}
/* 원카드 — 패의 카드를 끌어 가운데 슬롯에 놓으면 낸다 (Enter · Space로도 낼 수 있음) */
/* 도박장 카드 — 전투처럼 패의 카드를 끌어 슬롯에 놓으면 낸다 (Enter · Space로도 낼 수 있음) */
function cgDrag(el,slotId,fn){let st=null;const slot=()=>document.getElementById(slotId);
  const over=e=>{const s=slot();if(!s)return false;const b=s.getBoundingClientRect(),pad=24;return e.clientX>b.left-pad&&e.clientX<b.right+pad&&e.clientY>b.top-pad&&e.clientY<b.bottom+pad};
  const reset=()=>{st=null;el.classList.remove('drag');el.style.transform='';const s=slot();if(s)s.classList.remove('hot')};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;st={x:e.clientX,y:e.clientY,mv:false};try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.mv&&Math.hypot(dx,dy)<6)return;st.mv=true;
    const k=S.scale||1;el.classList.add('drag');el.style.transform=`translate(${dx/k}px,${dy/k}px)`;const s=slot();if(s)s.classList.toggle('hot',over(e))});
  el.addEventListener('pointerup',e=>{if(!st)return;const hit=st.mv&&over(e);reset();if(hit)fn()});
  el.addEventListener('pointercancel',reset);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
const ocBindDrag=(el,i)=>cgDrag(el,'ocSlot',()=>ocPlay(i));
function ocDraw(){const G=CG,t=G.pile[G.pile.length-1],mine=G.turn==='me'&&!G.done&&!G.pick;
  const body=`<div class="table"><div class="seat"><div class="ap-h">상대 · ${G.ai.length}장</div><div class="pcs small">${G.ai.map(()=>pcard(null,{back:true})).join('')}</div></div>
    <div class="seat mid"><div class="ocslot cgslot${mine?' live':''}" id="ocSlot">${pcard(t)}<em>${mine?'여기에 끌어 놓기':''}</em></div><div class="ocinfo"><b>문양 ${G.suit}</b>${G.atk>0?`<span class="dn">공격 ${G.atk}장</span>`:''}<span>${G.msg}</span><span>남은 더미 ${G.deck.length}장</span></div></div>
    <div class="seat"><div class="ap-h">나 · ${G.me.length}장 · ${G.turn==='me'?'내 차례':'상대 차례'}</div>
    <div class="pcs hand">${G.me.map((c,i)=>{const ok=mine&&ocOk(c);return`<div class="pcwrap${ok?' ok':' no'}" data-i="${i}" ${ok?'tabindex="0" role="button" aria-label="'+c.s+c.r+' 내기"':'aria-disabled="true"'}>${pcard(c)}</div>`}).join('')}</div></div></div>`;
  const acts=G.pick?SUITS.map(s=>`<button class="svc suit" data-s="${s}" aria-label="문양 ${s}"><b class="${s==='♥'||s==='♦'?'red':''}">${s}</b></button>`).join('')
    :`<button class="svc main" id="ocPass" ${mine?'':'disabled'}><b>${G.atk>0?`${G.atk}장 받기`:'한 장 받기'}</b></button>`;
  const m=cgFrame('원카드',body,acts);if(G.done)return;
  m.querySelectorAll('.hand .pcwrap.ok').forEach(el=>ocBindDrag(el,+el.dataset.i));
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>ocPickSuit(b.dataset.s));
  if($('#ocPass'))$('#ocPass').onclick=ocPass;
}

  const el=$('#foebar');if(!el||el.hidden)return null;for(const b of el.querySelectorAll('[data-foe]')){const rc=b.getBoundingClientRect();if(x>=rc.left&&x<=rc.right&&y>=rc.top&&y<=rc.bottom){const f=all[+b.dataset.foe];return alive(f)?f:null}}return null}
function afterReward(){const r=S.run,at=r.at||{};
  if(at.then==='fall')return a2Begin();
  if(at.then==='rush'){if(r.m2&&r.m2.inside)r.m2.inside.cur=(at.rush||0)+1;r.at=null;save();return showMap()}
  if(at.then==='laevWin'){r.flags.surtWeak=1;r.at=null;return landDome()}
  showMap()}
function startChase(){const r=S.run,at=r.at;const list=(at.chase||[]).map(f=>Object.assign(f,{fled:false,dead:false,noFlee:false,early:false}));
  r.at={kind:'combat',enemies:list,node:at.node,chased:true};save();transition(resumeAt)}

/* ================= boot ================= */
function boot(data){initSteal();
  if(data&&data.v===3&&data.S&&(data.S.run||data.S.H)){Object.assign(S,data.S,{busy:false});if(S.run)migrateRun(S.run);syncUID();
    if(S.C&&S.C.phase==='enemy')S.C.phase='player';}
  addEventListener('resize',fit);
  document.addEventListener('gesturestart',e=>e.preventDefault());
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  applyUI();const o0=S.orient;S.orient='';fit();if(!S.orient)S.orient=o0;
  if(!REDUCED)requestAnimationFrame(loop);
  if(S.H&&S.screen.startsWith('hunt')&&S.screen!=='huntOver')resumeHunt();
  else if(S.run&&['combat','map','reward','rest','shop','event'].includes(S.screen))resumeAt();
  else if(S.screen==='climbPrep')showClimbPrep();
  else if(S.screen==='annihPrep')showAnnihPrep();
  else showTitle({menu:!!S.titleMenu});
}
try{window.claude?.hot?.snapshot?.(()=>({v:3,S:JSON.parse(JSON.stringify({...S,busy:false}))}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

/* V17 글자 넘침 방지 — 카드 이름·앞면·뒷면 글이 칸을 넘으면 넘지 않을 때까지 글자 크기를 줄임 */
function fitBox(box){
  const inner=box.firstElementChild;if(!inner||!box.clientHeight)return;
  const sig=inner.innerHTML.length+'|'+box.clientWidth+'|'+box.clientHeight;if(box._fit===sig)return;
  box.style.fontSize='';let f=parseFloat(getComputedStyle(box).fontSize),min=f*.55,g=0;
  const over=()=>inner.scrollHeight>box.clientHeight+1||inner.scrollWidth>box.clientWidth+1;
  while(over()&&f>min&&g++<30){f*=.93;box.style.fontSize=f+'px'}
  box._fit=sig;
}
function fitCards(root=document){root.querySelectorAll('.ctext,.btext,.cname').forEach(fitBox)}
let fitQ=0;const fitSoon=()=>{if(fitQ)return;fitQ=requestAnimationFrame(()=>{fitQ=0;try{fitCards()}catch(e){}})};
try{new MutationObserver(fitSoon).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fitSoon)}catch(e){}
</script>

<style>.slotlist{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.slotrow{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:8px;border:1px solid #5d5547;background:linear-gradient(#262c33,#171b20)}
.slotrow.empty{opacity:.45;border-style:dashed}.slotrow.empty i{font-style:normal;color:var(--bone-dim)}

.slotinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.slotinfo b{font-family:var(--f-display);font-weight:400;font-size:20px}
.slotinfo span{font-size:14px;color:var(--bone)}.slotinfo i{font-style:normal;font-size:12px;color:var(--bone-dim)}
.slotbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.port .slotinfo b{font-size:24px}.port .slotinfo span{font-size:18px}.port .slotinfo i{font-size:15px}.port .slotrow{flex-wrap:wrap}</style><script>
"use strict";
/* ================= 저장 기록 — 최대 10개 (세계수 등반·절멸전 공용) ================= */
const SLOT_MAX=20,SLOT_KEY=i=>'ash-midgard-slot-'+i;
function slotRead(i){try{const s=localStorage.getItem(SLOT_KEY(i));return s?JSON.parse(s):null}catch(e){return null}}
function slotWrite(i,kind,data,manual){try{localStorage.setItem(SLOT_KEY(i),JSON.stringify({kind,t:Date.now(),data,manual:!!manual}));return true}catch(e){toast('저장','저장 공간이 부족하다 — 기록 하나를 지운 뒤 다시 저장한다');return false}}
/* 직접 저장 (V31.19.5) — 쯔꾸르처럼 같은 이야기를 여러 칸에 저장. 직접 저장한 칸은 자동 저장이 덮어쓰지 않음 */
const newRid=()=>Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36);
function autoSlotFor(o){if(!o.rid)o.rid=newRid();if(o.slot!=null){const x=slotRead(o.slot);if(x&&x.manual)o.slot=null;else if(x&&x.data&&x.data.rid&&x.data.rid!==o.rid)o.slot=null}
  if(o.slot==null){o.slot=S.pendingSlot!=null?S.pendingSlot:slotFree();S.pendingSlot=null;if(o.slot==null&&!o.noAutoWarn){o.noAutoWarn=true;toast('자동 저장','빈 칸이 없어 자동 저장을 멈췄다 — 메뉴의 저장하기로 직접 저장한다')}}return o.slot}
function manualSave(i){const hunt=S.H&&S.screen.startsWith('hunt'),o=hunt?S.H:S.run;if(!o)return false;if(!o.rid)o.rid=newRid();
  const d=JSON.parse(JSON.stringify(o));d.autoSlot=o.slot;delete d.slot;return slotWrite(i,hunt?'hunt':'climb',d,true)}
function loadSlotData(x,i){const d=x.data;if(x.manual){const a=d.autoSlot;delete d.autoSlot;const ax=a!=null?slotRead(a):null;d.slot=(ax&&!ax.manual&&ax.data&&ax.data.rid===d.rid)||(a!=null&&!ax)?a:slotFree()}else d.slot=i;return d}
function slotDel(i){try{localStorage.removeItem(SLOT_KEY(i))}catch(e){}}
function slotAll(){const a=[];for(let i=0;i<SLOT_MAX;i++)a.push(slotRead(i));return a}
function slotFree(){const a=slotAll();const i=a.findIndex(x=>!x);return i<0?null:i}
function slotCount(){return slotAll().filter(Boolean).length}
/* 이전 버전의 저장 1개씩을 저장 기록으로 옮김 */
(function slotMigrate(){try{
  const c=localStorage.getItem(SAVE_KEY);if(c){const i=slotFree();if(i!=null){const d=JSON.parse(c);d.slot=i;slotWrite(i,'climb',d)}localStorage.removeItem(SAVE_KEY)}
  const h=localStorage.getItem(HUNT_KEY);if(h){const i=slotFree();if(i!=null){const d=JSON.parse(h);d.slot=i;slotWrite(i,'hunt',d)}localStorage.removeItem(HUNT_KEY)}
}catch(e){}})();
save=function(){const r=S.run;if(!r)return;if(autoSlotFor(r)==null)return;slotWrite(r.slot,'climb',r)};
loadSave=function(){const r=S.run;if(r&&r.slot!=null){const x=slotRead(r.slot);return x&&x.kind==='climb'?x.data:null}return null};
clearSave=function(){const r=S.run;if(r&&r.slot!=null){const x=slotRead(r.slot);if(x&&x.kind==='climb'&&!x.manual)slotDel(r.slot)}};
function slotDesc(x){const d=x.data||{};
  if(x.kind==='hunt')return{n:'절멸전',s:`${(GODS[d.god]||{god:'?'}).god} · 처치 ${d.kills||0}${d.mode==='exterminate'?' / 2000':''}`};
  return{n:'세계수 등반',s:`${(CDIFF[d.diff]||CDIFF.easy).n} · ${d.act===2?`2장 니다벨리르 · ${d.floor||0}막`:`1장 · ${d.floor||0} / ${ROWS}막`} · ${d.mode==='dain'?'다인모드':`Lv ${d.lvl||1}`}`}}
function slotTime(t){if(!t)return'';const d=new Date(t),z=n=>String(n).padStart(2,'0');return`${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`}
/* 새로 시작할 막 고르기 — 빈 칸이 있으면 바로, 10개가 다 찼으면 덮어쓸 기록을 고름 */
function slotStart(go){S.pendingSlot=null;const i=slotFree();if(i!=null){S.pendingSlot=i;return go()}openSlots('over',null,go)}
function openSlots(mode,back,go){
  const m=$('#modal');m.hidden=false;const a=slotAll(),n=a.filter(Boolean).length;
  const over=mode==='over',sv=mode==='save',cur=sv?(S.H&&S.screen.startsWith('hunt')?S.H:S.run):null;
  const tag=x=>x.manual?'직접 저장':'자동 저장';
  const row=(x,i)=>{const own=sv&&cur&&cur.slot===i&&x&&!x.manual;
    if(!x)return over?'':`<div class="slotrow empty"><span class="slotno">${i+1}</span><i>비어 있음</i>${sv?`<div class="slotbtns" style="margin-left:auto"><button class="plate-btn" data-sv="${i}">여기에 저장</button></div>`:''}</div>`;const ds=slotDesc(x);
    const btns=over?`<button class="plate-btn danger" data-ov="${i}">이 기록에 덮어쓴다</button>`:sv?(own?'<i>지금 이야기의 자동 저장</i>':`<button class="plate-btn danger" data-sv="${i}" data-full="1">덮어써서 저장</button>`):`<button class="plate-btn" data-go="${i}">이어하기</button><button class="plate-btn" data-del="${i}">지우기</button>`;
    return`<div class="slotrow"><span class="slotno">${i+1}</span><div class="slotinfo"><b>${ds.n} · ${tag(x)}</b><span>${ds.s}</span><i>${slotTime(x.t)}</i></div><div class="slotbtns">${btns}</div></div>`};
  m.innerHTML=`<div class="panel" style="width:min(820px,100%);max-height:100%"><div class="maphead"><div><div class="psub">저장 기록 ${n} / ${SLOT_MAX}</div><div class="ptitle">${over?'저장 기록이 가득 찼다':sv?'저장하기':'저장 기록'}</div></div><button class="btn-ghost" id="slBack">${over?'취소':'닫기'}</button></div>
    ${over?`<div class="hint">저장 기록은 최대 ${SLOT_MAX}개까지 남는다. 새로 시작하려면 지울 기록 하나를 고른다.</div>`:sv?'<div class="hint">지금 상태를 고른 칸에 저장한다. 같은 이야기를 여러 칸에 저장해 두고 원하는 시점부터 다시 할 수 있다 · 직접 저장한 칸은 자동 저장이 덮어쓰지 않는다 · 전투 중이면 그 전투를 시작한 시점으로 저장된다</div>':'<div class="hint">진행할 때마다 자동 저장 칸에 저장된다. 메뉴의 저장하기로 원하는 칸에 직접 저장할 수 있다.</div>'}
    <div class="slotlist">${a.map(row).join('')}</div></div>`;
  $('#slBack').onclick=()=>{closeModal();if(back)back()};
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const i=+b.dataset.go,x=slotRead(i);if(!x)return;closeModal();
    const d=loadSlotData(x,i);if(x.kind==='hunt'){S.H=d;syncUID();transition(resumeHunt)}else{const sl=d.slot;S.run=migrateRun(d);S.run.slot=sl;syncUID();transition(resumeAt)}});
  m.querySelectorAll('[data-sv]').forEach(b=>{let armd=false;b.onclick=()=>{if(b.dataset.full&&!armd){armd=true;b.textContent='한 번 더 누르면 덮어씀';return}
    const i=+b.dataset.sv;if(manualSave(i)){toast('저장',`${i+1}번 칸에 저장했다`);if(cur&&cur.slot===i)cur.slot=null;openSlots(mode,back,go)}}});
  m.querySelectorAll('[data-del]').forEach(b=>{let armd=false;b.onclick=()=>{if(!armd){armd=true;b.textContent='한 번 더 누르면 지움';return}slotDel(+b.dataset.del);openSlots(mode,back,go);if(S.screen==='title'&&S.titleMenu)refreshTitleCont()}});
  m.querySelectorAll('[data-ov]').forEach(b=>{let armd=false;b.onclick=()=>{if(!armd){armd=true;b.textContent='한 번 더 누르면 지우고 시작';return}const i=+b.dataset.ov;slotDel(i);closeModal();S.pendingSlot=i;go&&go()}});
}
function refreshTitleCont(){const b=$('#mCont'),n=slotCount();if(!b)return;if(!n){b.remove();return}b.querySelector('small').textContent=`저장 기록 ${n} / ${SLOT_MAX}`}
/* ================= 상점 — 보관함 장비 판매 ================= */
function shopSell(back){const r=S.run;ensureGear(r);const m=$('#modal');m.hidden=false;
  const pct=Math.round(sellPrice(r.bag[0]||GEAR_KEYS[0])/Math.max(1,GEAR[r.bag[0]||GEAR_KEYS[0]].p)*100);
  m.innerHTML=`<div class="panel" style="width:min(1180px,100%);max-height:100%;overflow:auto"><div class="maphead"><div><div class="psub">보관함 ${r.bag.length}개 · 본래 가격의 ${pct}% · 보유 ${money(r.gold)}</div><div class="ptitle">보관함 장비 판매</div></div><button class="btn-ghost" id="mClose">돌아가기</button></div>
    <div class="eqgrid">${r.bag.length?r.bag.map((k,j)=>gearCardHTML(k,`<div class="eqact"><button class="plate-btn" data-sell="${j}">판매 <span class="price">+${money(sellPrice(k))}</span></button></div>`)).join(''):'<div class="hint">보관함에 장비가 없다 — 착용 중인 장비는 장비 화면에서 벗어 보관함에 넣은 뒤 팔 수 있다</div>'}</div></div>`;
  $('#mClose').onclick=()=>{closeModal();back()};
  m.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const j=+b.dataset.sell,k=r.bag[j];if(!k)return;const p=sellPrice(k);r.bag.splice(j,1);r.gold+=p;toast('판매',`「${GEAR[k].n}」 +${money(p)}`);save();renderTop();shopSell(back)});
}
/* ================= 게임 중 메뉴 — 계속하기 · 설정 · 중단하기 · 저장하고 나가기 ================= */
function inGame(){return(S.H&&S.screen&&S.screen.startsWith('hunt'))||(!!S.run&&!['title','over','victory'].includes(S.screen))}
function leaveToTitle(){const hunt=S.H&&S.screen.startsWith('hunt');S.setBack=null;closeModal();
  transition(()=>{if(hunt)hHideBattle();S.busy=false;if(S.C){S.C.over=true}S.C=null;S.H=null;showTitle({menu:true})})}
function openGameMenu(){if(!inGame())return;
  if(S.busy){toast('메뉴','행동이 끝난 뒤에 열 수 있다');return}
  const hunt=S.H&&S.screen.startsWith('hunt'),m=$('#modal');m.hidden=false;S.setBack=null;
  const fight=S.screen==='combat'||(hunt&&S.screen==='hunt');
  m.innerHTML=`<div class="panel" style="width:min(560px,100%)"><div class="maphead"><div><div class="psub">${hunt?'절멸전':'세계수 등반'}</div><div class="ptitle">메뉴</div></div></div>
    <div class="choices">
      <button class="choice" id="gmCont"><b>계속하기</b><span>게임으로 돌아간다</span></button>
      <button class="choice" id="gmSet"><b>설정</b><span>UI 크기 · 효과음 · 화면 흔들림 · 전환 팁 · 튜토리얼 · 패치 내역</span></button>
      <button class="choice" id="gmSv"><b>저장하기</b><span>원하는 칸에 지금 상태를 직접 저장 · 여러 칸에 나눠 저장할 수 있다</span></button>
      <button class="choice" id="gmSave"><b>저장하고 나가기</b><span>${fight?'지금 전투는 시작한 시점부터 다시 한다':'지금 막에서 이어 할 수 있다'} · 시작 화면으로</span></button>
      <button class="choice" id="gmQuit"><b>중단하기</b><span>이번 ${hunt?'절멸전':'등반'}을 그만두고 자동 저장 기록을 지운다 · 직접 저장한 칸은 남는다</span></button>
    </div></div>`;
  $('#gmCont').onclick=closeModal;
  $('#gmSet').onclick=()=>{S.setBack=openGameMenu;openSettings()};
  $('#gmSv').onclick=()=>{if(hunt)saveHunt();else save();openSlots('save',openGameMenu)};
  $('#gmSave').onclick=()=>{if(hunt)saveHunt();else save();toast('저장','저장 기록에 저장했다');leaveToTitle()};
  const q=$('#gmQuit');let armd=false;q.onclick=()=>{if(!armd){armd=true;q.querySelector('b').textContent='한 번 더 누르면 중단';q.querySelector('span').textContent='자동 저장 기록이 지워지고 되돌릴 수 없다 (직접 저장한 칸은 남음)';return}
    if(hunt)clearHunt();else clearSave();leaveToTitle()};
}
addEventListener('keydown',e=>{if(e.key!=='Escape'||!inGame())return;const m=$('#modal');if(m.hidden){e.preventDefault();openGameMenu()}});

</script>
