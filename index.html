function ensureGear(r){if(!r)return r;if(!r.bag)r.bag=[];if(!r.gear||r.gear.arm){if(r.gear)for(const s in r.gear)for(const k of r.gear[s])if(k&&GEAR[k]&&GEAR[k].nw)r.bag.push(k);r.gear={head:[null],body:[null],leg:[null],rh:[null],lh:[null],foot:[null]}}return r}
function wornGear(r=S.run){if(!r||!r.gear)return[];const o=[];for(const s of GSLOT_ORDER)for(const k of(r.gear[s]||[]))if(k&&GEAR[k])o.push(k);return o}
function gs(stat){if(!climbOn())return 0;let v=0;for(const k of wornGear())v+=GEAR[k].fx[stat]||0;return v}
function gearHp(r,dv){if(!dv)return;r.maxHp=Math.max(1,r.maxHp+dv);if(dv>0)r.hp+=dv;r.hp=Math.min(r.hp,r.maxHp)}
function wearAt(r,k,s,i){ensureGear(r);const old=r.gear[s][i];if(old)gearHp(r,-(GEAR[old].fx.hp||0));r.gear[s][i]=k;gearHp(r,GEAR[k].fx.hp||0);return old}
function takeOff(r,s,i){const old=r.gear[s][i];if(!old)return null;r.gear[s][i]=null;gearHp(r,-(GEAR[old].fx.hp||0));return old}
const sellPrice=k=>Math.floor(GEAR[k].p*(gs('sellFull')?1:eq('u_boots')?.8:.6));
const money=n=>{n=Math.max(0,Math.round(n||0));const dh=Math.floor(n/1000),s=n%1000;return dh?`${dh}단화 ${s}실링`:`${s}실링`};
function gearCardHTML(k,extra='',note=''){const e=GEAR[k];return`<div class="eqcard g-${e.g}"><span class="eqtag">${GRADE[e.g]} · ${GSLOT[e.s].n}${note?` · ${note}`:''}</span><b>${e.n}</b><div class="eqt">${e.t}</div><div class="eqp">본래 가격 ${money(e.p)}</div>${extra}</div>`}
function gearTotals(){const keys=['atk','def','acc','eva','hp','flat','block0','blockFirst','blockTurn','blockPct','healPct','restPct','goldPct','cost1'];
  const N={atk:'공격레벨',def:'방어레벨',acc:'명중',eva:'회피',hp:'최대 체력',flat:'고정 추가 피해',block0:'전투 시작 시 방어도',blockFirst:'전투 첫 턴 방어도',blockTurn:'매 턴 시작 시 방어도',blockPct:'방어도 획득량',healPct:'회복 효과',restPct:'휴식 회복량',goldPct:'전투 승리 시 실링',cost1:'전투 첫 턴 코스트'};
  const pc=new Set(['blockPct','healPct','restPct','goldPct']);
  return keys.map(k=>{let v=0;for(const g of wornGear())v+=GEAR[g].fx[k]||0;return v?`${N[k]} ${v>0?'+':''}${v}${pc.has(k)?'%':''}`:''}).filter(Boolean)}
/* 새 장비를 얻을 때 — 빈 칸이 있으면 바로 착용, 칸이 찼으면 교체(벗은 장비는 보관) · 기존 장비를 60%로 팔고 착용 · 새 장비를 보관 */
const gearBlocked=k=>!!(S.run&&S.run.act===1&&GEAR[k]&&GRADE_RANK[GEAR[k].g]>GRADE_RANK.rare);
function gainGear(k,done){
  const r=ensureGear(S.run),e=GEAR[k];if(!e)return done&&done();
  if(e.nw){r.bag.push(k);toast('장비',`「${e.n}」 — 장비 보관함으로`);save();renderTop();return done&&done()}
  if(gearBlocked(k)){r.bag.push(k);toast('장비',`「${e.n}」 — 미드가르드에서는 ${GRADE[e.g]} 등급을 착용할 수 없어 보관함에 넣었다`);save();renderTop();return done&&done()}
  const slots=r.gear[e.s],free=slots.indexOf(null);
  if(free>=0){wearAt(r,k,e.s,free);toast('장비',`「${e.n}」 착용 · ${GSLOT[e.s].n}`);save();renderTop();return done&&done()}
  const m=$('#modal');m.hidden=false;S.modalLock=true;
  m.innerHTML=`<div class="panel" style="width:min(980px,100%)"><div><div class="psub">${GSLOT[e.s].n} 칸이 찼다</div><div class="ptitle">새 장비 · ${e.n}</div></div>
    <div class="eqgrid">${gearCardHTML(k,'','새 장비')}${slots.map(o=>gearCardHTML(o,'','착용 중')).join('')}</div>
    <div class="choices">${slots.map((o,i)=>`<button class="choice" data-sw="${i}"><b>「${GEAR[o].n}」 대신 착용</b><span>벗은 장비는 보관함으로 간다</span></button>
      <button class="choice" data-sell="${i}"><b>「${GEAR[o].n}」 팔고 착용</b><span>본래 가격의 60% · +${sellPrice(o)}실링</span></button>`).join('')}
      <button class="choice" data-keep="1"><b>보관함에 넣는다</b><span>지금 장비는 그대로 둔다</span></button></div></div>`;
  const fin=()=>{closeModal();save();renderTop();done&&done()};
  m.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const old=wearAt(r,k,e.s,+b.dataset.sw);if(old)r.bag.push(old);toast('장비',`「${e.n}」 착용`);fin()});
  m.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const old=wearAt(r,k,e.s,+b.dataset.sell);if(old)r.gold+=sellPrice(old);toast('장비',`「${GEAR[old].n}」 판매 +${sellPrice(old)}실링 · 「${e.n}」 착용`);fin()});
  m.querySelector('[data-keep]').onclick=()=>{r.bag.push(k);toast('장비',`「${e.n}」 보관`);fin()};
}

const expNeed=L0=>Math.round(100*Math.pow(L0,1.5)*(1+.1*(zoneOf(L0+1)-1)));
/* 누적 LvHP% — 도달한 레벨마다 1.3% × 구간 */
function lvHpSum(L0){let s=0;for(let t=2;t<=L0;t++)s+=1.3*zoneOf(t);return s}
/* 레벨 L 체력 = 1레벨 체력 × (1 + 누적 LvHP% / 100) + 10 × (L − 1) */
const hpAt=(base1,L0)=>Math.round(base1*(1+lvHpSum(L0)/100)+10*(L0-1));
function gainExp(n,lines){
  const r=S.run;if((r.mode!=='human'&&r.mode!=='thor'&&r.mode!=='odin')||n<=0)return;
  if(TUNE.cb.expCap>0){const cap=Math.round(expNeed(r.lvl)*TUNE.cb.expCap);if(n>cap)n=cap}
  r.exp+=n;lines.push(['경험치',`+${n.toLocaleString()}`]);
  const l0=r.lvl;
  while(r.exp>=expNeed(r.lvl)){r.exp-=expNeed(r.lvl);r.lvl++}
  /* 체력은 전투가 끝나도 그대로 유지, 레벨업할 때 최대 체력의 5% 회복 (레벨마다) */
  if(r.lvl>l0){const k=r.lvl-l0,up=lvAB(r.lvl)-lvAB(l0);r.atk+=up;r.def+=up;const add=hpAt(r.base1,r.lvl)-hpAt(r.base1,l0);r.maxHp+=add;const h0=r.hp;r.hp=Math.min(r.maxHp,r.hp+k*Math.round(r.maxHp*(eq('u_diet')?.15:.05)));
    lines.push([`레벨 ${l0} → ${r.lvl}`,`공격레벨 +${up}, 방어레벨 +${up}, 최대 체력 +${add}, 체력 +${r.hp-h0} (${eq('u_diet')?15:5}% 회복${k>1?` ×${k}`:''})`])}
}
function cumExp(L0){let s=0;for(let k=1;k<L0;k++)s+=expNeed(k);return s}
/* 획득 경험치 = 상대 레벨까지의 누적 경험치의 66%, 주인공보다 레벨이 낮으면 33% */
function expFor(elv,plv){return Math.round(cumExp(elv)*(elv<plv?.33:.66))}

function genOpts(r,row){

  if(r.pal&&r.pal.k==='nord'&&row===11)return['rift'];
  if(r.mode==='dain')return[0,1,2].map(()=>rnd()<.25?'elite':'battle');
  if(row===1)return['battle','battle','battle'];
  /* 튜토리얼: 휴식과 상점에 한 번씩 꼭 들름 (건너뛰면 일반 지도) */
  if(r.tut&&row===2)return['rest','rest','rest'];
  if(r.tut&&row===3&&((r.map&&r.map.shops)||0)<SHOP_MAX)return['shop','shop','shop'];
  const out=[],shops=(r.map&&r.map.shops)||0;

    out.push(wpick(w))}

    +`<div class="gslot empty weapon"><span class="eqtag">무기</span><i>${S.run&&S.run.weapon&&WEAPON[S.run.weapon]?WEAPON[S.run.weapon].n:'무기'}</i></div>`;

    <div class="eqgrid">${r.bag.length?r.bag.map((k,j)=>gearCardHTML(k,lock?'':gearBlocked(k)?`<div class="eqact"><span class="hint">미드가르드에서는 착용할 수 없음</span></div>`:`<div class="eqact"><button class="plate-btn" data-wear="${j}">착용</button></div>`)).join(''):'<div class="hint">보관한 장비가 없다</div>'}</div>

    if(w==='plankIn'){closeModal();const got=await pickCardModal('스키드블라드니르의 판자','수납할 카드를 고른다 — 원하는 턴에 꺼내 쓸 수 있다',[...C.hand],'그만둔다');

/* ================= 운 주사위 판정 (웹게임 문서: 이벤트 판정) =================
   이벤트용 판정은 운 주사위(정36면체)로 함. P: 명중률, S: 이벤트에 따라 공격레벨 또는 방어레벨
   목표값 T = 36 - P/5 + 난이도 보정 · 최소값 M = 1 + (S ÷ 10, 소수점 버림), 최대 18
   주사위는 M~36 사이에서 나오고, T 이상이면 성공 · T가 M 이하면 굴리지 않고 무조건 통과 (궁니르는 무조건 통과)
   난이도 보정: 쉬움 -6, 보통 0, 어려움 +6 */
const DIFF={easy:{n:'쉬움',v:-6},normal:{n:'보통',v:0},hard:{n:'어려움',v:6}};
const LSTAT={atk:'공격레벨',def:'방어레벨',acc:null};
function luck(chk){
  const r=S.run,P=pAcc(),Sv=chk.s==='atk'?pAtk():chk.s==='def'?pDef():0;
  const T=36-P/5+DIFF[chk.d].v,M=Math.min(18,1+Math.floor(Sv/10))+(eqW('as_a')?2:0),need=Math.ceil(T);
  const auto=T<=M,pct=auto?100:need>36?0:Math.round((36-Math.max(need,M)+1)/(36-M+1)*100);
  return{P,Sv,T,M,need,auto,pct};
}
const chkLabel=(chk,L)=>`판정 · 명중률 ${L.P}%${LSTAT[chk.s]?` + ${LSTAT[chk.s]} ${L.Sv}`:' 단독'} · ${DIFF[chk.d].n} · ${L.auto?'무조건 통과':`성공 ${L.pct}%`}`;
function d36SVG(n,state){
  return`<svg class="d36 ${state||''}" viewBox="0 0 120 120" aria-hidden="true"><polygon class="d36o" points="60,4 108,32 108,88 60,116 12,88 12,32"/>
    <polygon class="d36i" points="60,22 92,41 92,79 60,98 28,79 28,41"/><path class="d36l" d="M60,4V22M108,32L92,41M108,88L92,79M60,116V98M12,88L28,79M12,32L28,41"/>
    <text x="60" y="62">${n}</text></svg>`;
}

  ['V2.32.58.14','11/20','1장 적을 새로 만듦 — 노른교 성직자(막기·말뿐인 저주·훈계·파문 선고), 노르드교 단원(어설픈 베기·숨 고르기·약점 노리기), 이단심문관(명령 이행-베기·내려찍기·처단, 새겨진 본능-단죄), 노르드교 이행자(행동-약점 찢기·표식 강제 부여·파쇄·처형 집행), 레벨·1레벨 스탯·행동 포인트 범위·덱 장수 변경 · 순수유물주의자 새로 만듦: 1페이즈는 망치로 직접 공격(행동 포인트 5, 정해진 순서, 뼈와 살의 해체학·으스러트리기·박 살·뜯어지는 강타·망치 돌리기), 2페이즈는 에인헤랴르 지휘(행동 포인트 3, 모든 카드 3코스트, 보존·간절한 기도·행동 예측, 명령-베기·내려찍기·방패 세우기·빈틈 노리기·전열 정리), 에인헤랴르는 직접 공격할 수 있고 2명 수복·턴마다 +1명(최대 7명)·피해를 받은 턴에는 원호 방어만 · 새 키워드: 표식(Ⅰ~Ⅴ)·약점 노출·골절·약화(최종 위력 -1)·이단 표식, 기존 약화는 허약으로 표기 · 이전 보스 특색(분노·광분·감정·낙인·인간의 몸·안 아프게 빨리) 삭제 · 2장은 막음: 1장 보스를 쓰러뜨리면 업데이트 대기 화면, 2장 건너뛰기 버튼 삭제'],
  ['V2.31.58.14','11/19','스토리 건너뛰기를 누르면 그 대화 전체를 선택지까지 전부 건너뜀 (선택지는 맨 위의 것을 고른 것으로 처리) / 2장 공방 상점은 그 구역 공방의 카드만 판매 (동 스타인러 · 남 아쉬부티 · 서 레미 · 북 크리뷔스 · 중앙 크리밀라)'],
  ['V2.31.57.14','11/16','삭제 — 암시장·도박장·유물 조각·특수 대장장이, 묠니르·궁니르·다인 획득 사건, 저주와 다인 패시브 저주, 강화 특수능력·합체, 휴식·상점·사건의 카드 삭제와 강화, 멸망 빌드(보스 3페이즈), 장비 탈취, 훔친 카드, 도전과제, 인트로 영상, 적 머리 위 행동 예고, 튜토리얼 성직자 대사 / 카드 키워드 설명(합체·강화·명사·지정불가·연계) 삭제, 카드 글씨 크게, 감정서 새 효과(작품-준비가 있으면 턴마다 50% 확률로 패에 들어오고, 쓰면 50% 확률로 작품-완성)'],
  ['V2.31.56.14','11/16','삭제 — 절멸전 코드 전부, 영웅 등급 카드 4장(미미르의 한 모금·글레이프니르의 실·드라우프니르의 파편·결계의 기억), 고치, 절멸전 영웅 처치 보상 16장, 사건 4개(층을 묶는 끈·파편 경매·미미르의 샘에서 흘러온 물·아랫지형으로 가는 승강기), 키워드 고유 명사·대명사, 신화무기 획득(묠니르·궁니르·레바테인·다인슬레이프 사건과 암시장 조각 판매)을 막음'],
  ['V2.31.55.14','11/15','전투 개편 — 적도 카드를 씀: 적마다 덱이 있고 플레이어처럼 코스트 3·5장 드로우(3턴마다 +1, 턴이 넘어가야 다시 참), 행동 포인트는 몹마다 범위 안에서 턴마다 정해지고 카드 1장마다 1 줄어 0이 되면 남은 코스트로 카드를 몰아서 냄, 턴이 끝날 때 남은 코스트를 다 씀, 고르는 순서는 부정적 키워드 → 코스트가 넉넉할 때 자신에게 이로운 카드 → 공격 → 방어, 기절·글레이프니르의 실은 다음 카드 1장만 막고 냉동은 그 턴 카드를 전부 막음, 적의 냉매는 적의 코스트를 얼림 · 적 머리 위 다음 행동 예고를 없앰 · 체력 밑에 코스트·행동 포인트 구슬 · 적을 누르면 옆으로 비켜서고 상태창이 열림(체력·방어도·코스트·행동 포인트·패시브·특성·카드 종류 동그라미·쓴 카드 기록, 한 번 쓴 카드는 색과 ×장수·코스트가 풀리고 판이 끝나도 남음) · 카드를 적에게 끌어 놓으면 대상이 바뀜 · 튜토리얼 적의 행동 안내 문구 변경'],
  ['V2.31.54.14','11/15','삭제하기로 한 것을 게임에서 삭제 — 카드 내던지기·쌓인 재·잿더미 방패·미련 없이(보상·상점·시작 덱 포함), 장비 아이템과 소유 효과 물건 전부(장비 칸 6개·장비 보관함·상점 장비 진열 칸은 남김, 적도 장비 없이 나옴), 사건 선택지에 남아 있던 카드 강화 문구(강화는 이미 삭제되어 아무 효과가 없었음), 장비 안내의 소유 효과 설명. 예전 저장 기록을 불러오면 삭제된 카드·장비를 걷어 내고 장비로 붙었던 최대 체력을 되돌림'],
  ['V2.31.53.14','11/13','기입관의 메모 — 받은 시점의 경과 시간만큼만 분석이 적혀 있음(10시간 이전은 조각만 · 10시간 한 줄 쓰다 만 상태 · 20시간 추측과 물음표 · 30시간 분류 시도 · 40시간 이후 그 조각에서 갈 수 있는 끝), 조각 글자는 언제나 온전함, 오래된 일의 조각은 끝까지 가도 덜 맞음. 갱신 — 같은 상태로는 다시 오지 않고 더 진행된 상태로 다시 올 수 있으며, 갱신된 메모가 위에 덮이고 이전 메모는 밑에 깔림(누르면 펼쳐짐, 노트와 보관함 모두). 50시간이 지나면 확정 메모가 반드시 옴.'],
  ['V2.31.52.14','11/13','기입관이 잘못 보낸 메모 — 노트가 갱신될 때 드물게(8%) 기입관의 메모가 섞여 내려옴, 중앙정부 문이 열릴 때까지 한 번도 안 왔으면 다음 갱신에 반드시 한 장, 한 번 받은 메모는 다른 판에서도 다시 오지 않음, 받은 메모는 그 판의 노트에 계속 남음. 메모는 손글씨 메모지 모양. 보관함 — 시작 화면과 게임 중 메뉴에서 열고, 처음에는 "아직 모은 것이 없다...", 받은 메모가 한 장씩 쌓이며 받은 순서 · 접수 번호 순서로 볼 수 있음, 저장 기록을 지워도 남음. 번호표 문구를 이방인 접수로 바꿈.'],
  ['V2.30.52.14','11/13','카드로 베기 — 공격 카드가 눕혀져 칼날처럼 적을 베고 지나감, 검 카드 9장(어설픈 베기·베기·피륙·갈라내기·도려내기·일섬·대절단·검도-정석·검도-변화)은 한 장씩 다른 움직임, 공방 카드는 공방별 움직임(스타인러 내려찍기·크리뷔스 미끄러짐·아쉬부티 붓질·레미 내려치기·크리밀라 던지기)에 타격 순서와 위력이 더해짐, 방어 카드는 방패 고리 · 기술 카드는 빛으로 흩어짐. 카드별 소리 — 휘두르는 소리와 맞는 소리 두 박자(피륙은 부웅 뒤 갈라지는 소리), 전부 합성음. 피격 — 적이 몸을 당겼다 덮침, 막으면 하늘색 방패 고리, 피하면 화면이 옆으로 미끄러짐. 적이 맞은 방향으로 밀리고 체력 막대는 깎인 양이 밝게 남았다 줄어듦, 빗나가면 적이 비켜섬. AUTO 중에는 눕는 동작 생략. 2장 색감을 쇠와 구리(푸른 쇳빛 바탕 · 구리 · 증기 빛)로 바꿈.'],
  ['V2.30.51.14','11/13','공방 대련장 — 각 지역 끝의 공방 막에서 "대련장에 들어간다", 언제든 그만둘 수 있고 지면 체력 1로 나옴, 이기면 그 공방 카드 3장 중 1장과 실링(500~1000), 적대로 이어지지 않고 경험치 없음. 정예에게 도전 — 스타인러 공방 장인 · 크리뷔스 공방 협업 책임자 · 아쉬부티 공방 수석 해설사 · 레미 공방 총주방장, 공방마다 한 번만 이길 수 있고 값비싼 카드 중에서 고르며 실링 3000~5000. 수입품 — 상점 카드 마지막 칸은 다른 공방의 카드, 값 20% 더. 2장 카드 값을 이전의 12분의 1로 낮춤(15단화 → 1단화 250실링, 60단화 → 5단화). 중앙정부 문은 20시간이 넘으면 열림(공방을 먼저 들르는 조건과 막 수 조건 삭제), 닫힌 문에 가려 하면 "이곳으로 갈 수 없습니다"와 함께 노트에 번호표가 끼워짐.'],
  ['V2.29.50.14','11/13','상점은 자동으로 들어가지 않음 — 2장은 상점 막에 서면 지도에 "상점에 입장한다"(여관이면 "여관에 들어간다") 버튼이 생기고 누르지 않으면 그냥 지나감, 1장은 상점 막에서 입장할지 지나갈지 고름. 강제 때문에 갈 수 있는 막이 하나도 없어 고립되던 문제 수정 — 지금 선 자리에서 나갈 길 하나와 중앙정부로 가는 길은 항상 남고, 이미 고립된 저장은 그 자리에서 강제가 적용되지 않음.'],
  ['V2.29.49.13','11/13','인물의 말풍선이 떠 있는 동안 아무것도 눌리지 않던 문제 수정 — 말풍선은 조작을 막지 않고, 어디를 누르든 말풍선이 닫히면서 누른 것이 그대로 눌림.'],
  ['V2.29.49.12','11/13','기입관 밸런스 — 페이즈당 체력을 난이도별로 정함(매우 쉬움 4000 · 쉬움 5000 · 보통 6000 · 어려움 8000 · 매우 어려움 10000). 기입관의 공격은 주사위 하나당 내 최대 체력의 정해진 범위 안으로 들어옴(서류 정리 하나당 보통 8~20% · 어려움 10~24% · 매우 어려움 10~27%, 삭제는 보통 25~40% · 어려움 25~45% · 매우 어려움 25~50%에 대비 배율 — 막으면 -80%, 못 막으면 +100%). 2페이즈의 공격 위력 +25%는 없앰.'],
  ['V2.29.48.12','11/13','자명종의 강제와 기입관의 고정 — 니다벨리르에 온 뒤 10시간마다 강제가 하나 걸리고(갈 수 없음 · 가야 함 · 살 수 없음 · 주식을 사고팔 수 없음 · 장비를 바꿀 수 없음 · 카드를 뺄 수 없음 · 새로고침해도 바뀌지 않음), 굳지 않은 강제는 다음 10시간에 사라지고 새 강제가 생김. 행동 3회(이동 · 사건 · 상점 · 시간 보내기 · 선택지)마다 걸려 있는 강제 하나가 굳어 풀리지 않음. 노트 — 상점에 들어갈 때마다 관으로 내려와 갱신, 글만 있으면 강제 · 도장이 찍혀 있으면 고정. 중앙정부 문 — 판마다 10~20막 사이에서 정해진 막 수를 지나고 20시간을 넘겨야 열림, 문이 열린 뒤에는 강제가 사라지지 않고 10시간마다 겹쳐 쌓임. 기입관 보스전 개조 — 특성 바꾸기 · 카드 종류 무효 · 따라 쓰기 삭제, 한 턴에 같은 카드를 2번째 쓰면 검게 변하고 3번째는 효과 없이 자물쇠(2턴), 그 턴에 가장 많이 쓴 카드는 다음 1턴 잠김, 카드 3장마다 묶인 카드에 도장(전투 끝까지 사용 불가), 체력 1 이하에서 즉시 턴 종료 후 전부 회복(2페이즈), 체력 상향. 공방 동료(제바르크 · 오토 · 견습생) 영입을 이전으로 되돌림 — 리테만 남음.'],
  ['V2.28.47.12','11/7','화면 개편 — 대화 장면을 비주얼 노벨식으로(허리 위 인물 · 말하는 사람만 밝게 · 이름표 · 아래 대사창 · 대사를 눌러도 다음 · 위쪽에 지역 이름과 기록 · 자동 · 선택지는 대사창 아래 가로 버튼), 전투는 동료 얼굴 칸을 왼쪽 위에(말풍선은 얼굴 옆 · 말할 때 빛남 · 맞으면 흔들림), 위쪽 가운데 턴 수, 행동력을 불씨 구슬로, 턴 종료를 테두리 버튼으로, 위쪽 정보를 둥근 칸으로, 화면 테두리. 동료가 2장에서 회색으로 보이던 문제 수정. 그림이 없는 인물은 실루엣으로 자리만 잡아 둠'],

  ['V2.19.27.3','10/30','절멸전 레벨 상승 — 오딘 체력 95,284(-9,528) · 공 1,009(+40) · 방 1,002(+10), 토르 Lv 1200 · 체력 210,395 · 공 1,210(+121) · 방 1,210(+484), 수르트 Lv 1500 · 체력 456,961 · 공·방 1,510(+765). +천둥의신·멸망의 의인화는 %로, 외안은 기본 체력 -10%. 천둥 3코스트 · 가중치는 전격의 합. 섭취-강화 상한 없앰(세계수 등반도). 절멸전 보정: 인간·영웅의 레벨·공방렙이 신의 공격레벨이 오른 비율만큼 오르고, 체력·공격 피해·방어도·고정 피해(소각·전격)에 배율을 붙여 예전 절멸전의 손맛과 버티기를 유지(다인은 그대로)'],
  ['V2.19.26.3','10/30','신화 무기 · 신화 빌드 밸런스 — 2장 적 장비 등급 확률 변경(영웅 91 · 전설 8 · 신화 1%, 지금까지는 신화 5%로 나왔음). 신화 장비 수치 조정: 정의된 관 공·방 +60 → +45, 이름 없는 갑주 최대 체력 +500 → +300 · 방어레벨 +40 → +45, 기록관의 팔찌 명중 +50 → +30 · 회피 +30 → +20. 신화 빌드로 바뀔 때 공격레벨·방어레벨·최대 체력은 신의 기준 수치와 지금 주인공 수치 중 높은 쪽(다인 · 토르 · 레바테인 수르트모드 모두, 다인은 레벨 1 고정 · 섭취 상한 그대로). 레바테인 수르트모드는 레벨을 이어 감(체력 300 · 레벨 1로 시작하던 것)'],
  ['V2.19.25.3','10/30','주식 밸런스 — 위험이 클수록 기대 수익이 큼(레미 안정 · 크리밀라 고위험), 종목마다 급등·급락 빈도와 크기가 다름, 오름세는 지도 이동으로 흐른 시간에만 붙고 시간 넘기기는 오르내리기만 함, 시간 넘기기는 상점 한 번 들를 때마다 최대 24시간, 매도 수수료 2%(손익·평가는 수수료를 뺀 금액), 주가 하한은 기준가의 10%'],
  ['V2.19.24.3','10/30','드래그 중 예상 체력 — 공격 카드를 끌어 상대 위(또는 사용 위치)에 올리면 그 상대의 체력 막대에 공격 후 남을 체력 범위를 보여 줌(밝은 칸은 최소 피해, 줄무늬 칸은 최대 피해까지), 아래에 「현재 → 예상 체력 · 적중률 · 타수」, 쓰러뜨릴 수 있으면 처치/처치 가능 표시. 방어도·취약·약화 등 지금 상태를 반영, 뭉치는 장수만큼 합산. 적중하지 않으면 피해 없음'],
  ['V2.19.23.3','10/30','가시성 — 패의 카드에 종류별 후광: 공격 빨간색 · 방어 파란색 · 지원(기술·지속) 초록색 · 저주 보라색, 지금 사용할 수 없는 카드(코스트 부족·봉인·적 턴 등)는 후광 없음. 끌어서 낼 수 있는 위치에 오면 후광이 더 밝아짐'],
  ['V2.19.22.3','10/30','아쉬부티 공방 보존파(모작파에서 이름 변경) — 보존파 고증가의 견해 묻기에 세 번째 선택지 추가: 방어도가 50 이상일 때만 보이는 「얻기만 하고 사용하지 않겠다」(…! — 말문이 막혀 다음 행동 취소)'],
  ['V2.19.21.3','10/30','아쉬부티 공방 곡해파 — 니다벨리르 일반 적 「아쉬부티 공방 곡해파 전시가」 추가, 곡해(쓸 때마다 약화 · 방어도 · 드로우 감소 · 예술적 감각 중 무작위 반응). 첫 만남 — 전투에 들어가기 전 그림과 선택지 창만 뜸: 신화 원전은 잔혹한가 · 신성한가 · 정론은 무엇인가, 답마다 50%로 전투 또는 그냥 지나감, 「신화엔 정론이란 없다」는 50%로 곡해파 입단 제의. 아쉬부티 공방 보존파 — 니다벨리르 일반 적 「아쉬부티 공방 보존파 고증가」 추가, 고증(같은 행동을 연달아 이을 때마다 예술적 감각 +1, 3이면 작품 제작). 전투 중 견해 묻기 — 강한 유물을 대가를 치르더라도 쓰겠느냐: 사용한다(단죄 — 최대 체력 30% 트루 데미지) / 사용하지 않겠다(전투 지속). 아쉬부티 공방 방직파 — 니다벨리르 일반 적 「아쉬부티 공방 방직파 직조공」 추가(아쉬부티 상점 전투의 직원). 짜임새(앞과 다른 행동을 이을 때마다 예술적 감각 +1, 3이면 작품 제작 → 2턴 뒤 작품 완성, 공격 위력 +200%). 견해 묻기 — 전투에 한 번, 작품의 실을 어디에 연결할지 물음: 뿔처럼 보이는 곳(전투 지속) / 평평한 곳(예술적 감각 3 이상 또는 작품이 있으면 처치 없이 전투 종료 · 실링만, 아니면 전투 지속) / 남의 시선에 의존하느냐는 질문(상대가 예술적 감각을 전부 소모해 분노, 1당 공격 위력 +30%)'],
  ['V2.18.21.3','10/30','기믹 — 정예 · 보스의 일부 공격에 조건이 붙음. 대비(방어도로 막으면 피해 -80% · 못 막으면 +100%), 간파(회피를 올려 두면 반드시 빗나감 · 아니면 반드시 적중, 피해 +50%), 기세 꺾기(이번 턴 그 적에게 최대 체력 15% 이상 피해를 주면 피해 -70% · 아니면 +50%). 의도에 기믹 이름과 지금 성공/실패가 보이고 예상 피해가 바로 바뀜. 붙은 공격 — 이단심문관 처단(대비), 순수유물주의자 공양의 칼(기세 꺾기), 송출관 승강기 레버(대비), 특허 심사관 반려 서류(간파), 스타인러 장인 과열 망치(기세 꺾기), 크리뷔스 협업 책임자 얼음 깨기(간파), 레미 총주방장 무쇠 팬(대비), 아쉬부티 해설사 전시 지팡이(기세 꺾기), 경비원 진압봉(대비), 기록하는 공무원 삭제(대비)'],
  ['V2.18.20.3','10/30','세계수 등반 전투 밸런스 — 1장 적 체력 · 공격 피해 배율(일반 체력 ×4 · 피해 ×3.5, 정예 ×2 · ×1.6, 보스 ×1.3 · ×1.2, 처음 8막 동안은 서서히 올라감), 2장 정예 · 보스는 낮춤(정예 체력 ×0.4 · 피해 ×0.3, 보스 ×0.3 · ×0.4 — 회복 없는 중앙정부 연전에 맞춤), 난이도별 적 배율 조정(매우 쉬움 0.75 · 쉬움 1 · 보통 1.1 · 어려움 1.15 · 매우 어려움 1.3), 특허 — 실링이 모자라면 카드를 못 쓰던 것을 최대 체력 4%로 대신 냄'],
  ['V2.18.19.3','10/30','2장 장비 탈취 — 공격레벨 · 방어레벨로 대신하던 것을 없애고 적이 착용한 장비를 실제로 빼앗음. 2장 적은 영웅(공방 장비, 그 적의 공방 우선) · 전설 · 신화 무구를 착용, 전설 · 신화는 니다벨리르 무구 8종'],
  ['V2.18.18.3','10/30','주사위 연출 — 공격 주사위가 굴러간 뒤 주사위 값 · 위력 · 적중률 · 피해를 가운데에 크게 보여 주고 나서 공격이 들어감(나와 적 모두, 같은 카드의 다음 주사위는 빠르게, 누르면 빨리 넘김, 설정에서 끌 수 있음). 여러 적 전투 — 오른쪽 목록 대신 절멸전처럼 적이 화면에 따로따로 서고, 누르거나 카드를 끌어 놓은 적이 대상이 됨(적마다 의도 · 체력 · 행동 수치)'],
  ['V2.18.17.3','10/30','주식은 2장 니다벨리르에서만(공방 상점 · 암시장, 1장에서는 시간이 흐르지 않음). 1장 미드가르드에서는 일반~희귀 장비만 나오고 영웅 등급 이상은 착용할 수 없음(얻으면 보관함으로) — 1장 적 소지 장비는 일반~희귀, 1장 암시장 물건은 희귀 등급 9종. 2장 니다벨리르(밑 공방)부터 적은 전부 영웅 등급 이상 무구를 착용(탈취 시 장비 대신 공격레벨 · 방어레벨)'],
  ['V2.18.16.3','10/30','암시장 — 상점에 들어가면 10% 확률로 본래 상점 대신 열림(1장·2장, 튜토리얼 상점 제외). 장점과 단점이 모두 큰 전설 장비 9종 중 4개 진열, 묠니르의 파편 · 궁니르의 조각 판매(같은 것을 9개 모으면 획득 사건, 묠니르·궁니르 획득 사건), 거래 칸에 주식과 도박장. 도박장은 암시장에서만 열리고 본래 상점에서는 빠짐. 2장 가격은 1장의 100배. 암시장 튜토리얼'],
  ['V2.17.16.3','10/30','도박장 카드를 전투처럼 끌어서 냄 — 포카드는 바꿀 카드를 끌어 교체 칸에 놓고 바꾸기(교체 칸의 카드를 누르면 패로 돌아옴), 블랙잭은 히트 · 스탠드 · 더블 행동 카드를 끌어 내 카드 위에 놓음, 원카드와 같은 방식 · Enter로도 낼 수 있음'],
  ['V2.17.15.3','10/30','주식 시간 넘기기 — 주식 화면 안에서 +1시간 · +6시간 · +24시간, 이동하지 않고 시간을 보내 주가를 움직임'],
  ['V2.17.14.3','10/30','상점·주식·도박장 화면 손봄 — 상점이 스크롤 없이 한 화면에 다 보임(카드·장비·버튼 크기 줄임), 오른쪽 버튼은 이름과 꼭 필요한 값만, 장비는 효과만 짧게 보이고 누르면 가격까지 전부 보임, 카드 설명은 두 줄까지 보이고 누르면 뒷면에 전부. 주식·도박장 화면도 작게 줄이고 설명을 덜어냄. 원카드는 전투처럼 패의 카드를 끌어 가운데 카드 위에 놓아서 냄'],
  ['V2.17.13.3','10/30','상점 화면 개편 — 오른쪽(세로 화면은 아래) 빈 자리에 큰 버튼으로 카드 강화 · 카드 제거 · 새로고침 · 장비 판매 · 주식 · 도박장 · 떠난다 · 전투를 모음, 구매 버튼도 크게. 도박장 — 판돈 1단화 · 10단화 · 100단화, 게임 원카드(2인 · 7장, 2·A 공격, J·Q·K 한 번 더, 7 문양 바꾸기, 승리 2배) · 포카드(5장 한 번 교체, 족보 배당 J 이상 원페어 1배 ~ 로열 스트레이트 플러시 250배) · 블랙잭(히트 · 스탠드 · 더블, 승리 2배 · 블랙잭 2.5배 · 무승부 1배). 튜토리얼 — 주식 · 도박장 · 원카드 · 포카드 · 블랙잭을 처음 열 때 설명, 다시 보기 버튼, 설정에서 튜토리얼 다시 보기를 켜면 함께 다시 나옴'],
  ['V2.16.13.3','10/30','용어 변경 — 장은 이야기 기준(1장 미드가르드 · 2장 니다벨리르, 이전의 막), 막은 전투·정예·상점·사건 한 곳 기준(이전의 칸), 턴은 전투 턴 기준. 주식·도박 — 모의 주식: 니다벨리르 5대 공방 5종목(레미·스타인러·아쉬부티·크리뷔스·크리밀라, 종목마다 변동성이 다름, 가끔 급등·급락), 지도에서 한 막 이동할 때마다 1시간이 지나고 주가가 움직임, 1장·2장 모든 상점의 주식 버튼에서 매수·매도(1 · 10 · 100 · 최대 / 전부 매도), 보유 주수·평균가·평가 손익·최근 48시간 그래프. 도박(2장 공방 상점): 10 · 30 · 50단화 중 판돈을 걸고 운 판정(명중률 단독 · 보통), 성공하면 판돈의 2배를 돌려받고 실패하면 잃음'],
  ['V2.15.13.3','10/30','게임 중 메뉴 — 상단 메뉴 버튼(또는 Esc)으로 계속하기 · 설정 · 저장하고 나가기 · 중단하기(두 번 눌러 확인, 저장 기록 지움), 세계수 등반·절멸전 모두, 세로 화면 상단 막대 정리'],
  ['V2.15.12.3','10/30','저장 기록 최대 10개(세계수 등반·절멸전 공용, 이어하기·목록·지우기, 10개가 차면 덮어쓸 기록 고름), 상점에서 보관함 장비 판매(본래 가격 60%), 등급 색(일반 흰색 · 희귀 초록색 · 영웅 보라색 · 전설 노란색 · 신화 빛나는 하얀색), 2장 철제 돔 d99 판정을 둘 다 무조건 실패로'],

function openPatch(back){
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="panel" style="width:min(720px,100%)"><div class="maphead"><div><div class="psub">지금 버전 ${PATCH[0][0]} · V(장).(새 콘텐츠).(보강).(버그 수정) — 모든 자리는 누적 · 버전을 누르면 바뀐 점이 펼쳐짐</div><div class="ptitle">패치 내역</div></div><button class="btn-ghost" id="mClose">닫기</button></div>
    <div class="patchlist">${PATCH.map(([v,d,t],i)=>`<details${i===0?' open':''}><summary><b>${v}</b><i>${d}</i></summary><span>${t}</span></details>`).join('')}</div></div>`;
  $('#mClose').onclick=back||closeModal;
}

function openSettings(){

  m.innerHTML=`<div class="panel" style="width:min(640px,100%)"><div class="maphead"><div class="ptitle">설정</div><button class="btn-ghost" id="mClose">${S.setBack?'메뉴로':'닫기'}</button></div>
    <div class="choices">
      <button class="choice" id="sEnv"><b>환경 설정</b><span>UI 크기 · 효과음 · 화면 흔들림 · 주사위 연출 · 전환 팁 · 튜토리얼 다시 보기</span></button>
      <button class="choice" id="sPatch"><b>패치 내역 · ${PATCH[0][0]}</b><span>버전별로 바뀐 점</span></button>
      ${S.setBack?'':`<button class="choice" id="sSlots"><b>저장 기록 · ${slotCount()} / ${SLOT_MAX}</b><span>세계수 등반 저장 기록을 보고 이어하거나 지움 (최대 10개)</span></button>`}
    </div></div>`;
  $('#mClose').onclick=()=>{const b=S.setBack;S.setBack=null;if(b)b();else closeModal()};
  $('#sEnv').onclick=openEnvSettings;
  $('#sPatch').onclick=()=>openPatch(openSettings);

  if($('#sSlots'))$('#sSlots').onclick=()=>openSlots('manage',openSettings);
}

const frontOf=d=>CARD_FRONT[d.name]||d.front||(d.type==='atk'?'적을 타격합니다':d.type==='def'?'공격을 막습니다':'효과를 발휘합니다');
function facesHTML(id,costBlock,inst,n=1){
  const d=CARDS[id],nm=cardName(id,inst)+(n>1?` ×${n}`:'');const long=nm.length>6;
  const rd=inst&&S.C&&S.screen==='combat'&&S.C.redef&&S.C.redef[inst.uid];
  const txt=(rd?`<span class="modline">재정의${rd.dc?` · 코스트 ${rd.dc>0?'+1':'-1'}`:''}${rd.swap?' · 공격↔방어':''}</span><br>`:'')+(inst&&S.C&&S.C.nullKinds&&S.screen==='combat'&&S.C.hand&&S.C.hand.includes(inst)&&nulled(inst)?'<span class="modline">무효로 정의됨 — 주사위 값 0</span><br>':'')+d.text.replace(/\n/g,'<br>');const dense=d.text.length>56;
  const tl=(d.rar==='special'?`특수무기 · ${TYPE_LABEL[d.type]}`:RAR_LABEL[d.rar]?`${RAR_LABEL[d.rar]} · ${TYPE_LABEL[d.type]}`:TYPE_LABEL[d.type]);
  return`<div class="lift"><div class="inner">
    <div class="face front r-${d.rar} gr-${cardGrade(id)||'none'} t-${d.type}">${costBlock}<div class="cname${long?' long':''}"><span>${nm}</span></div><div class="art">${CARD_ART[id]?`<img src="${CARD_ART[id]}" alt="">`:''}</div><div class="ctext"><div>${frontOf(d)}</div></div><div class="ctype">${tl}</div><div class="marks"></div></div>
    <div class="face back r-${d.rar} gr-${cardGrade(id)||'none'} t-${d.type}"><div class="bname">${nm}</div><div class="btext${dense?' dense':''}"><div>${txt}</div></div><div class="rule"></div><div class="flavor">${d.flavor}</div></div>
  </div></div>`;
}
/* 카드 앞면 주사위 — 전투 중이면 예상 피해 범위와 적중률을 함께 표시 */
function diceRowHTML(id,inst){
  const d=CARDS[id];if(!d.d||!d.d.length)return'';
  const C=S.C,live=inst&&C&&!C.over&&C.hand&&C.hand.includes(inst)&&S.screen==='combat';
  const g=[];for(const x of d.d){const l=g[g.length-1];if(l&&l.t===x.t&&l.a===x.a&&l.b===x.b)l.n++;else g.push({...x,n:1})}
  return g.map(x=>{let p='';
    if(live&&S.screen==='combat'){
      if(x.t==='atk'){const v=pPreview(inst,x);p=`<span><em>${v.lo}~${v.hi}</em> · 적중 ${v.ch}%</span>`}
      else if(x.t==='def'){const f=v=>Math.round(v*(pt('defUp')?1.25:1)*(pt('defDown')?.75:1));p=`<span><em>+${f(x.a)}~${f(x.b)}</em></span>`}
      else{const room=Math.max(0,EVA_DICE_CAP-C.evaB);p=`<span>적중 ${hitChance(enemyAcc(),pEva())}→<em>${hitChance(enemyAcc(),pEva()+Math.min(x.b,room))}%</em></span>`}}
    if(!p)return'';
    return`<div class="dz ${x.t}"><b>${x.t==='atk'?'예상 피해':x.t==='def'?'방어도':'적 적중'}${x.n>1?` ×${x.n}`:''}</b>${p}</div>`}).join('');
}
function staticCard(id,showBack,inst){
  const d=CARDS[id],lt=0,dainLike=!!(S.run&&S.run.mode==='dain');
  let cb;
  if(d.unplayable)cb='<div class="cost none"></div>';
  else if(dainLike){const pct=d.hpCost!=null?d.hpCost:Math.max(0,(d.cost||0)-lt)*TUNE.humanHpCostPerCost;cb=`<div class="cost hp"><b>HP<br>${pct}%</b></div>`}
  else cb=`<div class="cost${lt?' down':''}"><b>${Math.max(0,(d.cost||0)-lt)}</b></div>`;
  return`<div class="scard${showBack?' flipped':''}" tabindex="0" role="button" aria-label="${cardName(id,inst)}: ${d.text.replace(/\n/g,' ')}">${facesHTML(id,cb,inst)}</div>`;
}
function flipCard(el){if(REDUCED){el.classList.toggle('flipped');return}if(el.classList.contains('turning'))return;el.classList.add('turning');setTimeout(()=>el.classList.toggle('flipped'),150);setTimeout(()=>el.classList.remove('turning'),310)}
function bindStatic(root){root.querySelectorAll('.scard').forEach(el=>{const f=()=>flipCard(el);el.addEventListener('click',f);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})})}
/* 같은 카드는 한 뭉치로 묶음 (찌르기 ×2) — 뭉치는 한 번에 모두 사용, 행동 포인트도 장수만큼 줄어듦 */
function stackKey(c){const C=S.C;return[c.id,(c.mods||[]).join(','),c.temp?'t':'',C.seal&&C.seal[c.uid]?'s'+C.seal[c.uid]:'',C.brand&&C.brand.includes(c.uid)?'b':'',c.w||''].join('|')}

function hpPreview(c,n,f){

  const o=(()=>{try{return cardStrikeOpts(c)}catch(e){return{}}})();C.E=prev;
  lo*=n;hi*=n;const bl=o.pierce?0:(f.block||0);

function impactEnemy(loss,bl,CK){
  const C=S.C,E=C&&C.E;if(!E)return 0;const o=L[S.orient],x=o.ex,y=o.efeet-o.eh*.55;
  if(loss<=0){if(bl){sparks(x,y,7,'#cfe6ff');sfx('block')}return 0}
  const fr=loss/Math.max(1,E.maxHp),tier=(fr>=.12||loss>=60)?3:(fr>=.05||loss>=25)?2:1;
  if(!CK)slashFx(x,y,tier);sparks(x,y,3+tier*2,CK?CK.K.col:null,tier);if(tier>=3)ringFx(x,y,tier);
  if(CK){cutHitSfx(CK.kind,tier,CK.n,CK.id);$('#enemy').style.setProperty('--kx',CK.dirx)}else sfx(tier>=3?'big':'hit',.8+tier*.25);if(tier>=3)shake(.9);

}

/* ================= 니다벨리르 공방 고유 키워드 (증기·열기·냉매·냉동·깨짐·예술적 감각·작품·먹기·배부름·포화) =================
   플레이어 쪽 값은 S.C(p…), 적 쪽 값은 적 객체에 둠 */
const NEGS=[['weak','약화',1],['vuln','취약',1],['el','전격',3],['burn','소각',10],['cool','냉매',1],['steam','증기',3]];/* 무작위 부정적 키워드 — 수치는 임시 */
function heatCap(isP){return isP?2+(gs('heatMax')||0)+(S.C.heatCapAdd||0):(S.C.E&&ENEMY[S.C.E.key].heatMax)||2}
/* 플레이어에게 부여 */
function a2Give(k,n){const C=S.C,r=S.run;if(!C||n<=0)return;
  if(k==='steam'){n*=gs('steam2')?2:1;C.pSteam=(C.pSteam||0)+n;fxAt('player',`증기 +${n}`,'info');clog(`플레이어에게 증기 ${n} (현재 ${C.pSteam})`,'e');return}
  if(k==='cool'){if(gs('coolImm')){fxAt('player','보온 장갑 — 냉매 무시','block');return}
    if(C.pBurn>0){const neu=Math.min(n,Math.ceil(C.pBurn/10));C.pBurn=Math.max(0,C.pBurn-neu*10);n-=neu;clog(`냉매 ${neu} — 자신의 소각 중화`,'e');if(n<=0)return}
    C.pCool=(C.pCool||0)+n;fxAt('player',`냉매 +${n}`,'info');clog(`플레이어에게 냉매 ${n} (현재 ${C.pCool})`,'e');
    if(C.pCool>=3&&!C.pFrozen){C.pFrozen=true;C.pFrozenTurn=C.turn+1;toast('냉동','다음 턴 동안 행동할 수 없다');clog('냉매 3 이상 — 냉동 (다음 내 턴 행동 불가)','e')}return}
  if(k==='burn'){if(gs('burnImm')){fxAt('player','단열 외투 — 소각 무효','block');return}if(C.pCool>0){const neu=Math.min(C.pCool,Math.ceil(n/10));C.pCool-=neu;n=Math.max(0,n-neu*10);clog(`자신의 냉매 ${neu}가 소각을 중화`,'e');if(n<=0)return}
    C.pBurn=Math.min(100,(C.pBurn||0)+n);fxAt('player',`소각 +${n}`,'info');return}
  if(k==='el'){if(r.mode==='thor'){fxAt('player','천둥의 신 — 전격 무시','block');return}C.pEl=(C.pEl||0)+n;fxAt('player',`전격 +${n}`,'info');return}
  if(k==='weak'){C.pWeak=Math.min(10,C.pWeak+n);fxAt('player',`약화 ${n}`,'info');return}
  if(k==='vuln'){C.pVuln=Math.min(10,C.pVuln+n);fxAt('player',`취약 ${n}`,'info');return}
}

}

function a2Hit(k,n,E=S.C.E){const C=S.C;if(!E||n<=0)return;
  if(k==='cool'){if(E.burn>0){const neu=Math.min(n,Math.ceil(E.burn/10));E.burn=Math.max(0,E.burn-neu*10);n-=neu;clog(`냉매 ${neu} — 대상의 소각 중화`);if(n<=0)return}

  if(k==='el'){E.el+=n;clog(`전격 ${n} 부여`);return}

function a2RandNeg(diff){const E=S.C.E;let pool=NEGS;if(diff&&E.lastNeg)pool=NEGS.filter(x=>x[0]!==E.lastNeg);const[k,n,v]=(()=>{const p=pick(pool);return[p[0],p[1],p[2]]})();E.lastNeg=k;clog(`무작위 부정적 키워드: ${n} ${v}`,'e');a2Give(k,v)}
function a2SealRandom(t){const C=S.C,pool=C.hand.filter(c=>!CARDS[c.id].unplayable&&!C.seal[c.uid]);if(!pool.length)return;const c=pick(pool);C.seal[c.uid]=t;toast('반려 서류',`「${cardName(c.id,c)}」 ${t}턴 봉인`);clog(`반려 서류: 「${CARDS[c.id].name}」 ${t}턴 봉인`,'e')}
/* 먹기 — 1당 최대 체력 +5% (최대 10), 10이면 배부름 +50%, 배부름 3턴 뒤부터 턴마다 포화 +1 (최대 5) */
function foodMaxOf(base,f,full){return Math.round(base*(.05*f+(full?.5:0)))}
function foodSync(who,isP){const r=S.run;
  if(isP){const C=S.C;const want=foodMaxOf(C.baseMax||r.maxHp,C.food||0,C.full)*(gs('foodHp2')?2:1);const d=want-(C.foodAdd||0);if(!d)return;C.foodAdd=want;r.maxHp+=d;if(d>0)r.hp+=d;r.hp=Math.min(r.hp,r.maxHp);return}
  const E=who;E.baseMax=E.baseMax||E.maxHp;const want=foodMaxOf(E.baseMax,E.food||0,E.full);const d=want-(E.foodAdd||0);if(!d)return;E.foodAdd=want;E.maxHp+=d;if(d>0)E.hp+=d;E.hp=Math.min(E.hp,E.maxHp)}
function foodGain(who,n,isP){const C=S.C,o=isP?C:who;if(!isP)who.baseMax=who.baseMax||who.maxHp;else C.baseMax=C.baseMax||S.run.maxHp-(C.foodAdd||0);
  o.food=Math.min(10,(o.food||0)+n);o.foodTurn=C.turn;if(o.food>=10&&!o.full){o.full=true;o.fullT=0;if(isP)toast('배부름','최대 체력 +50%');else fxAt('enemy','배부름','info')}
  foodSync(who,isP);if(isP)fxAt('player',`먹기 +${n}`,'info');else fxAt('enemy',`먹기 +${n}`,'info')}
function foodTurn(who,isP){const C=S.C,o=isP?C:who;if(!o.food)return;

  const C=S.C,r=S.run;if(E.key!=='clerk'||E.defined||E.hp>E.maxHp*.5||E.hp<=0)return;E.defined=true;E.phase=2;E.idx=0;
  const negs=Object.keys(PTRAIT).filter(k=>PTRAIT[k].c<0&&!PTRAIT[k].hide&&!r.traits.includes(k));const nk=pick(negs);
  if(r.traits.length){const i=Math.floor(rnd()*r.traits.length);C.defOrig={i,k:r.traits[i]};r.traits[i]=nk;toast('정의',`자명종이 다시 정의했다 — 「${PTRAIT[C.defOrig.k].n}」 → 「${PTRAIT[nk].n}」 (이번 전투)`)}
  else{C.defAdd=nk;r.traits.push(nk);toast('정의',`자명종이 다시 정의했다 — 「${PTRAIT[nk].n}」 (이번 전투)`)}
  clog('정의: 페이즈 2 — 정정 → 삭제','e');E.intent='정정';foeRedeal(E);E.hand.unshift('정정')}
function a2CombatEnd(C){const r=S.run;if(!C||C.endDone)return;C.endDone=true;
  if(C.foodAdd){r.maxHp-=C.foodAdd;r.hp=Math.min(r.hp,r.maxHp);C.foodAdd=0}
  if(C.defOrig){r.traits[C.defOrig.i]=C.defOrig.k}if(C.defAdd){const i=r.traits.indexOf(C.defAdd);if(i>=0)r.traits.splice(i,1)}
  if(C.mealAtk){r.atk-=C.mealAtk;r.def-=C.mealAtk;C.mealAtk=0}

/* 카드 효과 (2장 공방 카드 · 토르 카드) — playCardRaw의 switch에서 부름 */
async function a2CardFx(c,ctx){const C=S.C,r=S.run,E=C.E;
  if(CARDS[c.id].fx)await CARDS[c.id].fx(c,ctx);
  switch(c.id){
    case's2_vent':{const n=C.pSteam||0;C.pSteam=0;if(n)gainBlock(n*20,0,`압력 배출 (증기 ${n} × 20)`);break}
    case's2_over':a2Give('steam',10);break;
    case's2_valve':a2Hit('cool',3);C.pSteam=Math.max(0,(C.pSteam||0)-10);C.energy+=1;break;
    case'k2_spray':a2Hit('cool',3);break;
    case'k2_warm':C.pCool=0;C.pFrozen=false;C.energy+=1;break;
    case'k2_keep':C.keepWarm=(C.keepWarm||0)+1;break;
    case'a2_stand':C.artOn=true;artAdd(1);break;
    case'a2_talk':C.talkDisc=(C.talkDisc||0)+2;break;
    case'a2_cert':{const w=C.hand.find(x=>x.id==='art_wip');if(!w){clog('감정서: 패에 작품-준비가 없다 — 변화 없음');break}
      if(rnd()<.5){C.hand.splice(C.hand.indexOf(w),1);C.exh.push(w);C.hand.push({uid:UID++,id:'art_done',temp:true});C.master=true;toast('감정서','작품-준비 → 작품-완성');clog('감정서: 작품-준비 → 작품-완성')}else{toast('감정서','실패 — 변화 없음');clog('감정서: 실패, 변화 없음')}break}
    case'a2_copy':{const sp=[...C.draw,...C.disc].filter(x=>CARDS[x.id].rar==='special'&&!CARDS[x.id].unplayable);if(!sp.length){clog('유물 모사화: 덱에 특수무기 카드가 없다');toast('유물 모사화','덱에 특수무기 카드가 없다');break}
      const s=pick(sp),t={uid:UID++,id:s.id,mods:[],temp:true,free:true};C.hand.push(t);clog(`유물 모사화: 「${CARDS[s.id].name}」의 효과를 그대로 발동`);await playCardRaw(t.uid,{noTick:true});break}
    case'r2_tea':C.energy+=2;break;
    case'r2_meal':r.atk+=15;r.def+=15;C.mealAtk=(C.mealAtk||0)+15;fxAt('player','공·방 +15','info');break;
    case'm2_bolt':a2Hit('el',1);break;
    case'm2_burn':a2Hit('burn',5);break;
    case'm2_proto':for(let i=0;i<3;i++){const[k,nm,v]=pick(NEGS);a2Hit(k,v);fxAt('enemy',`${nm} ${v}`,'info')}break;
    /* 토르 (묠니르) — 등반 신화 빌드 */
    case't_swing':C.energy+=1;break;
    case't_fist':drawN(1);break;
    case't_throw':C.thrown=true;thorSwap();C.hand.push({uid:UID++,id:'t_recall',temp:true});break;
    case't_recall':C.thrown=false;thorSwap();drawN(1);break;
    case't_hunt':if(ctx.killed){C.yu=Math.min(5,C.yu+1);C.energy+=1;toast('사냥','유희 +1, 코스트 1 반환')}break;
    case't_bolt':{/* 즉시 전격을 발동(소모)시키고 전격 1당 최대 체력의 10%(최대 100%, 보스 5%·50%) — 명중률 무시, 마비 50% */
      const W=weightTargets(c);for(const f of W.tg){if(C.over||!alive(f))continue;const n=f.el;if(!n){fxAt('enemy','전격 없음','miss');continue}f.el=0;const bt=f.tier==='boss',per=bt?.05:.1,cap=bt?.5:1;const dmg=Math.round(f.maxHp*Math.min(cap,n*per));
        const pv=C.E;C.E=f;fixedDmg(dmg,'전격',true);if(!C.over&&alive(f)&&rnd()<.5){f.para=1;fxAt('enemy','마비','info')}if(!C.over&&alive(pv))C.E=pv}
      drawN(1);C.energy+=1;break}
    /* V32 오딘 (궁니르) — 등반 신화 빌드 */
    case'o_mimir':drawN(4);C.energy+=2;C.evaB=(C.evaB||0)-999;fxAt('player','이번 턴 회피 불가','info');break;
    case'o_shard':{const nx=C.hand.find(x=>x.id==='o_shard'&&x.uid!==c.uid);
      if(nx){clog('파편: 패에 파편이 있어 재사용');if(!C.over)await playCardRaw(nx.uid,{noTick:true})}
      else{let n=0;for(const x of r.deck)if(x.id==='o_shard'){x.id=pick(['o_mark','o_pierce']);n++}for(const a of[C.draw,C.disc])for(const x of a)if(x.id==='o_shard')x.id=pick(['o_mark','o_pierce']);if(n){clog(`파편: 패에 파편이 없어 덱의 파편 ${n}장이 무작위 투척 카드로 바뀜`);toast('파편','파편이 투척 카드로 돌아왔다')}}break}
    case'o_recall':{const f=C.E;if(alive(f)&&f.mark){const m=f.mark,bt=f.tier==='boss',per=bt?.025:.05,cap=bt?.25:.5;fixedDmg(Math.round(f.maxHp*Math.min(cap,m*per)),'궁니르-회수',true);f.mark=0;
        let back=0;for(let i=0;i<m;i++){let x=C.disc.find(y=>y.id==='o_mark'),from=C.disc;if(!x){x=C.draw.find(y=>y.id==='o_mark');from=C.draw}if(!x)break;from.splice(from.indexOf(x),1);C.hand.push(x);back++}
        if(back)toast('궁니르-회수',`투척-명중 ${back}장을 돌려받았다`)}break}
    case'o_shatter':{const f=C.E;const m=alive(f)?(f.mark||0):0;if(m){const per=Math.round(m*15/5);for(let i=0;i<5&&!C.over&&alive(f);i++)fixedDmg(per,'궁니르-파쇄',true);f.mark=0}else fxAt('enemy','궁니르-명중 없음','miss');
      const isT=x=>x.id==='o_mark'||x.id==='o_pierce';if(r.deck.some(isT)){r.deck=r.deck.filter(x=>!isT(x));for(const a of[C.hand,C.draw,C.disc]){for(let i=a.length-1;i>=0;i--)if(isT(a[i]))a.splice(i,1)}for(let i=0;i<5;i++){const n=addToDeck('o_shard');C.disc.push({uid:n.uid,id:n.id})}toast('궁니르-파쇄','투척 카드가 파편 5장이 되었다')}break}
  }
  if(d2food(c)){foodGain(null,d2food(c),true);if(gs('foodBlock'))gainBlock(gs('foodBlock'),0,'배식 국자')}
}
const d2food=c=>CARDS[c.id].food||0;
function thorSwap(){const C=S.C;for(const a of[C.hand,C.draw,C.disc])for(const c of a){if(C.thrown&&c.id==='t_swing')c.id='t_fist';else if(!C.thrown&&c.id==='t_fist'&&!c.temp)c.id='t_swing'}}

/* ================= 도망치기 (플레이어) — 1턴 소모 후 판정, 성공하면 보상 없이 도망 (노드는 미개척), 실패하면 그 턴만 상대 카드 값 2배 · 정예·보스는 불가 =================
   성공률 = 100 − ((상대 명중 − 20) − ((내 회피 + 20) − 50)) — 두 값을 합치는 식은 문서에 없어 적중률 공식을 뒤집어 씀 (임시), 5~95% */
function fleeChance(){const C=S.C;const acc=Math.max(...liveFoes().map(f=>{const pv=C.E;C.E=f;const a=enemyAcc();C.E=pv;return a}));
  return clamp(Math.round(100-((acc-20)-((pEva()+20)-50))),5,95)}
function canFlee(){const C=S.C;if(C&&C.atInfo&&C.atInfo.spar)return!C.over;return!!(C&&!C.over&&!C.noFlee&&!(C.E&&C.E.rift)&&liveFoes().every(f=>f.tier==='normal')&&!C.rush&&!(S.run.tut&&tutOn()))}
function fleeTry(){const C=S.C;if(!canFlee()||C.phase!=='player'||S.busy||C.select)return;
  if(C.atInfo&&C.atInfo.spar)return confirmBox('대련을 그만둘까요?','보상 없이 대련장을 나간다. 깎인 체력은 그대로 남는다.','그만둔다',sparLeave);
  confirmBox('도망칠까요?',`이번 턴을 쓰고 주사위를 굴린다. 성공 ${fleeChance()}% — 성공하면 보상 없이 도망치고 이 막은 미개척으로 남는다. 실패하면 이번 턴 상대 카드 값이 2배가 된다.`,'도망친다',()=>{C.fleeTry=true;endTurn()})}
function fleeResolve(){const C=S.C;if(!C.fleeTry)return false;C.fleeTry=false;const ch=fleeChance(),roll=ri(1,100),ok=roll<=ch;
  clog(`도망치기 · 성공률 ${ch}% · 판정 ${roll} → ${ok?'성공':'실패'}`,'h');
  if(!ok){C.fleeX=2;toast('도망 실패','이번 턴 상대 카드 값 2배');return false}
  toast('도망쳤다','보상 없이 빠져나왔다');C.over=true;C.phase='over';S.busy=false;a2CombatEnd(C);const r=S.run;
  setTimeout(()=>{hideCombatUI();r.next=null;
    if(r.act===2){r.at=null;save();showMap()}
    else{const M=r.map,u=r.mapUndo;if(u){M.row=u.row;M.path.pop();M.opts=u.opts;M.shops=u.shops;r.floor=u.floor}r.at=null;save();showMap()}},REDUCED?60:500);return true}

function showA2First(){const r=S.run,at=r.at;if(at.node!=null&&r.m2){const n=r.m2.nodes[at.node];if(n)n.cleared=true}S.screen='event';renderTop();
  const resc=!r.flags.a2Felled,list=resc?sceneRescue(r.dir):sceneRain(false);if(resc)r.flags.pendRain=1;
  showScene(list.filter(x=>!(x&&x.fx==='none')),()=>{r.at=null;save();transition(()=>showMap())})}
function showA2Rain(){const r=S.run,at=r.at;if(at&&at.node!=null&&r.m2){const n=r.m2.nodes[at.node];if(n)n.cleared=true}S.screen='event';renderTop();

function storyMap(){const r=S.run,M=r.map,F=r.flags;if(r.mode!=='human'||!M)return false;
  const go=l=>{save();showScene(l,()=>showMap());return true};
  if(!F.sOpen&&M.row===0){F.sOpen=1;save();showScene(S_OPEN,()=>enterNode(0));return true}F.sOpen=1;
  if(F.riftDone&&!F.sRift){F.sRift=1;const l=F.riftDone==='dead'?'노르드교의 붉은 천만 남아 있다.':'그가 앉아 있던 자리에는 아무도 없었다.';r.pal=null;return go([l])}
  if(!F.sNord&&M.row>=1&&M.row<11){F.sNord=1;r.pal={k:'nord'};return go(S_NORD)}
  if(r.pal&&r.pal.k==='nord'){if(!F.sTree&&M.row>=3){F.sTree=1;return go(S_TREE)}if(!F.s5&&M.row>=5){F.s5=1;return go([['부상당한 노르드교 단원','역시 내 눈이 틀리지 않았어. 자네는 우리 사람이야.']])}if(!F.sRumor&&M.row>=9){F.sRumor=1;return go(S_RUMOR)}}
  if(!F.sVow&&M.row>=12){F.sVow=1;return go(S_VOW)}
  return false}

function jmSafe(extra){const M=S.run.m2,seen=new Set([M.cur]),q=[M.cur];

/* ================= 전투 보조 — 행동 위력, 예상 피해, 적 목록, 보상 뒤 진행 ================= */

function renderFoeFigs(){const C=S.C,bx=$('#foefigs');if(!bx)return;const o=L[S.orient];if(o.ex0==null){o.ex0=o.ex;o.ew0=o.ew;o.eh0=o.eh}

/* V17 글자 넘침 방지 — 카드 이름·앞면·뒷면 글이 칸을 넘으면 넘지 않을 때까지 글자 크기를 줄임 */
function fitBox(box){
  const inner=box.firstElementChild;if(!inner||!box.clientHeight)return;
  const sig=inner.innerHTML.length+'|'+box.clientWidth+'|'+box.clientHeight;if(box._fit===sig)return;
  box.style.fontSize='';let f=parseFloat(getComputedStyle(box).fontSize),min=f*.55,g=0;
  const over=()=>inner.scrollHeight>box.clientHeight+1||inner.scrollWidth>box.clientWidth+1;
  while(over()&&f>min&&g++<30){f*=.93;box.style.fontSize=f+'px'}
  box._fit=sig;
}

"use strict";
/* ================= 저장 기록 — 최대 20개 ================= */
const SLOT_MAX=20,SLOT_KEY=i=>'ash-midgard-slot-'+i;
function slotRead(i){try{const s=localStorage.getItem(SLOT_KEY(i));return s?JSON.parse(s):null}catch(e){return null}}
function slotWrite(i,kind,data,manual){try{localStorage.setItem(SLOT_KEY(i),JSON.stringify({kind,t:Date.now(),data,manual:!!manual}));return true}catch(e){toast('저장','저장 공간이 부족하다 — 기록 하나를 지운 뒤 다시 저장한다');return false}}
/* 직접 저장 (V31.19.5) — 쯔꾸르처럼 같은 이야기를 여러 칸에 저장. 직접 저장한 칸은 자동 저장이 덮어쓰지 않음 */
const newRid=()=>Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36);
function autoSlotFor(o){if(!o.rid)o.rid=newRid();if(o.slot!=null){const x=slotRead(o.slot);if(x&&x.manual)o.slot=null;else if(x&&x.data&&x.data.rid&&x.data.rid!==o.rid)o.slot=null}
  if(o.slot==null){o.slot=S.pendingSlot!=null?S.pendingSlot:slotFree();S.pendingSlot=null;if(o.slot==null&&!o.noAutoWarn){o.noAutoWarn=true;toast('자동 저장','빈 칸이 없어 자동 저장을 멈췄다 — 메뉴의 저장하기로 직접 저장한다')}}return o.slot}
function manualSave(i){const o=S.run;if(!o)return false;if(!o.rid)o.rid=newRid();
  const d=JSON.parse(JSON.stringify(o));d.autoSlot=o.slot;delete d.slot;return slotWrite(i,'climb',d,true)}
function loadSlotData(x,i){const d=x.data;if(x.manual){const a=d.autoSlot;delete d.autoSlot;const ax=a!=null?slotRead(a):null;d.slot=(ax&&!ax.manual&&ax.data&&ax.data.rid===d.rid)||(a!=null&&!ax)?a:slotFree()}else d.slot=i;return d}
function slotDel(i){try{localStorage.removeItem(SLOT_KEY(i))}catch(e){}}
function slotAll(){const a=[];for(let i=0;i<SLOT_MAX;i++)a.push(slotRead(i));return a}
function slotFree(){const a=slotAll();const i=a.findIndex(x=>!x);return i<0?null:i}
function slotCount(){return slotAll().filter(Boolean).length}
/* 이전 버전의 저장 1개씩을 저장 기록으로 옮김 */
(function slotMigrate(){try{
  const c=localStorage.getItem(SAVE_KEY);if(c){const i=slotFree();if(i!=null){const d=JSON.parse(c);d.slot=i;slotWrite(i,'climb',d)}localStorage.removeItem(SAVE_KEY)}
  for(let i=0;i<SLOT_MAX;i++){const x=slotRead(i);if(x&&x.kind!=='climb')slotDel(i)}

save=function(){const r=S.run;if(!r)return;if(autoSlotFor(r)==null)return;slotWrite(r.slot,'climb',r)};
loadSave=function(){const r=S.run;if(r&&r.slot!=null){const x=slotRead(r.slot);return x&&x.kind==='climb'?x.data:null}return null};
clearSave=function(){const r=S.run;if(r&&r.slot!=null){const x=slotRead(r.slot);if(x&&x.kind==='climb'&&!x.manual)slotDel(r.slot)}};
function slotDesc(x){const d=x.data||{};

function slotTime(t){if(!t)return'';const d=new Date(t),z=n=>String(n).padStart(2,'0');return`${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`}
/* 새로 시작할 막 고르기 — 빈 칸이 있으면 바로, 10개가 다 찼으면 덮어쓸 기록을 고름 */

    return`<div class="slotrow"><span class="slotno">${i+1}</span><div class="slotinfo"><b>${ds.n} · ${tag(x)}</b><span>${ds.s}</span><i>${slotTime(x.t)}</i></div><div class="slotbtns">${btns}</div></div>`};
  m.innerHTML=`<div class="panel" style="width:min(820px,100%);max-height:100%"><div class="maphead"><div><div class="psub">저장 기록 ${n} / ${SLOT_MAX}</div><div class="ptitle">${over?'저장 기록이 가득 찼다':sv?'저장하기':'저장 기록'}</div></div><button class="btn-ghost" id="slBack">${over?'취소':'닫기'}</button></div>
    ${over?`<div class="hint">저장 기록은 최대 ${SLOT_MAX}개까지 남는다. 새로 시작하려면 지울 기록 하나를 고른다.</div>`:sv?'<div class="hint">지금 상태를 고른 칸에 저장한다. 같은 이야기를 여러 칸에 저장해 두고 원하는 시점부터 다시 할 수 있다 · 직접 저장한 칸은 자동 저장이 덮어쓰지 않는다 · 전투 중이면 그 전투를 시작한 시점으로 저장된다</div>':'<div class="hint">진행할 때마다 자동 저장 칸에 저장된다. 메뉴의 저장하기로 원하는 칸에 직접 저장할 수 있다.</div>'}
    <div class="slotlist">${a.map(row).join('')}</div></div>`;
  $('#slBack').onclick=()=>{closeModal();if(back)back()};
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const i=+b.dataset.go,x=slotRead(i);if(!x)return;closeModal();
    const d=loadSlotData(x,i);const sl=d.slot;S.run=migrateRun(d);S.run.slot=sl;syncUID();transition(resumeAt)});
  m.querySelectorAll('[data-sv]').forEach(b=>{let armd=false;b.onclick=()=>{if(b.dataset.full&&!armd){armd=true;b.textContent='한 번 더 누르면 덮어씀';return}
    const i=+b.dataset.sv;if(manualSave(i)){toast('저장',`${i+1}번 칸에 저장했다`);if(cur&&cur.slot===i)cur.slot=null;openSlots(mode,back,go)}}});
  m.querySelectorAll('[data-del]').forEach(b=>{let armd=false;b.onclick=()=>{if(!armd){armd=true;b.textContent='한 번 더 누르면 지움';return}slotDel(+b.dataset.del);openSlots(mode,back,go);if(S.screen==='title'&&S.titleMenu)refreshTitleCont()}});
  m.querySelectorAll('[data-ov]').forEach(b=>{let armd=false;b.onclick=()=>{if(!armd){armd=true;b.textContent='한 번 더 누르면 지우고 시작';return}const i=+b.dataset.ov;slotDel(i);closeModal();S.pendingSlot=i;go&&go()}});
}
function refreshTitleCont(){const b=$('#mCont'),n=slotCount();if(!b)return;if(!n){b.remove();return}b.querySelector('small').textContent=`저장 기록 ${n} / ${SLOT_MAX}`}
/* ================= 상점 — 보관함 장비 판매 ================= */
function shopSell(back){const r=S.run;ensureGear(r);const m=$('#modal');m.hidden=false;
  const pct=Math.round(sellPrice(r.bag[0]||GEAR_KEYS[0])/Math.max(1,GEAR[r.bag[0]||GEAR_KEYS[0]].p)*100);
  m.innerHTML=`<div class="panel" style="width:min(1180px,100%);max-height:100%;overflow:auto"><div class="maphead"><div><div class="psub">보관함 ${r.bag.length}개 · 본래 가격의 ${pct}% · 보유 ${money(r.gold)}</div><div class="ptitle">보관함 장비 판매</div></div><button class="btn-ghost" id="mClose">돌아가기</button></div>
    <div class="eqgrid">${r.bag.length?r.bag.map((k,j)=>gearCardHTML(k,`<div class="eqact"><button class="plate-btn" data-sell="${j}">판매 <span class="price">+${money(sellPrice(k))}</span></button></div>`)).join(''):'<div class="hint">보관함에 장비가 없다 — 착용 중인 장비는 장비 화면에서 벗어 보관함에 넣은 뒤 팔 수 있다</div>'}</div></div>`;
  $('#mClose').onclick=()=>{closeModal();back()};
  m.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const j=+b.dataset.sell,k=r.bag[j];if(!k)return;const p=sellPrice(k);r.bag.splice(j,1);r.gold+=p;toast('판매',`「${GEAR[k].n}」 +${money(p)}`);save();renderTop();shopSell(back)});
}
/* ================= 게임 중 메뉴 — 계속하기 · 설정 · 중단하기 · 저장하고 나가기 ================= */
function inGame(){return(!!S.run&&!['title','over','victory'].includes(S.screen))}
function leaveToTitle(){S.setBack=null;closeModal();
  transition(()=>{S.busy=false;if(S.C){S.C.over=true}S.C=null;showTitle({menu:true})})}
function openGameMenu(){if(!inGame())return;
  if(S.busy){toast('메뉴','행동이 끝난 뒤에 열 수 있다');return}
  const m=$('#modal');m.hidden=false;S.setBack=null;
  const fight=S.screen==='combat';
  m.innerHTML=`<div class="panel" style="width:min(560px,100%)"><div class="maphead"><div><div class="psub">세계수 등반</div><div class="ptitle">메뉴</div></div></div>
    <div class="choices">
      <button class="choice" id="gmCont"><b>계속하기</b><span>게임으로 돌아간다</span></button>
      <button class="choice" id="gmSet"><b>설정</b><span>UI 크기 · 효과음 · 화면 흔들림 · 전환 팁 · 튜토리얼 · 패치 내역</span></button>
      <button class="choice" id="gmVault"><b>보관함</b><span>${memoSeen().length?`${memoSeen().length}장`:'아직 모은 것이 없다...'}</span></button>
      <button class="choice" id="gmSv"><b>저장하기</b><span>원하는 칸에 지금 상태를 직접 저장 · 여러 칸에 나눠 저장할 수 있다</span></button>
      <button class="choice" id="gmSave"><b>저장하고 나가기</b><span>${fight?'지금 전투는 시작한 시점부터 다시 한다':'지금 막에서 이어 할 수 있다'} · 시작 화면으로</span></button>
      <button class="choice" id="gmQuit"><b>중단하기</b><span>이번 등반을 그만두고 자동 저장 기록을 지운다 · 직접 저장한 칸은 남는다</span></button>
    </div></div>`;
  $('#gmCont').onclick=closeModal;
  $('#gmSet').onclick=()=>{S.setBack=openGameMenu;openSettings()};$('#gmVault').onclick=()=>openVault(openGameMenu);
  $('#gmSv').onclick=()=>{save();openSlots('save',openGameMenu)};
  $('#gmSave').onclick=()=>{save();toast('저장','저장 기록에 저장했다');leaveToTitle()};
  const q=$('#gmQuit');let armd=false;q.onclick=()=>{if(!armd){armd=true;q.querySelector('b').textContent='한 번 더 누르면 중단';q.querySelector('span').textContent='자동 저장 기록이 지워지고 되돌릴 수 없다 (직접 저장한 칸은 남음)';return}
    clearSave();leaveToTitle()};
}
addEventListener('keydown',e=>{if(e.key!=='Escape'||!inGame())return;const m=$('#modal');if(m.hidden){e.preventDefault();openGameMenu()}});

</script>
